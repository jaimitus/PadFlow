[package]
name = "mouse_driver"
version = "1.4.0"
edition = "2021"
authors = ["Mouse Acceleration Team"]
description = "Native high-performance mouse driver with acceleration curve processing"
license = "MIT"

[dependencies]
# HID device communication (Linux: libusb, Windows: hidapi)
hidapi = { version = "2.6", features = ["linux-shared-hidraw"] }

# IPC communication with Electron app
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
unixsocket = "0.1" # For Unix domain sockets (Linux/macOS)

# Logging
log = "0.4"
env_logger = "0.11"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Battery monitoring (Linux: upower, Windows: windows crate)
[target.'cfg(target_os = "linux")'.dependencies]
dbus = "0.9"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_Security",
]}

[profile.release]
opt-level = 3
lto = true
strip = true

[[bin]]
name = "mouse_driver_daemon"
path = "src/main.rs"

[lib]
name = "mouse_driver_lib"
path = "src/lib.rs"
