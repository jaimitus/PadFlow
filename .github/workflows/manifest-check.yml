name: CI - Windows manifest check

on:
  push:
    paths:
      - "src-tauri/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/manifest-check.yml"
  pull_request:
    paths:
      - "src-tauri/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/manifest-check.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manifest-check:
    name: Verify requireAdministrator manifest embedding
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      # tauri::generate_context!() embeds ../dist at compile time, so the
      # frontend must be built before any Rust compile.
      - name: Build frontend
        run: npm run build

      # The requireAdministrator manifest is embedded by build.rs during the
      # cargo build itself (no bundling / signing required).
      - name: Build release exe
        working-directory: src-tauri
        run: cargo build --release

      - name: Build debug exe
        working-directory: src-tauri
        run: cargo build

      - name: Release exe MUST embed requireAdministrator + Win10 supportedOS
        shell: bash
        run: |
          test -f src-tauri/target/release/padflow.exe || { echo "FAIL - release exe was not built"; exit 1; }
          if grep -a -q "requireAdministrator" src-tauri/target/release/padflow.exe \
            && grep -a -q "8e0f7a12-bfb3-4fe8-b9a5-48fd50a15a9a" src-tauri/target/release/padflow.exe; then
            echo "OK - release exe embeds requireAdministrator (elevated manifest)"
          else
            echo "FAIL - elevated manifest missing from release exe"
            exit 1
          fi

      - name: Debug exe must NOT embed requireAdministrator
        shell: bash
        run: |
          test -f src-tauri/target/debug/padflow.exe || { echo "FAIL - debug exe was not built"; exit 1; }
          if grep -a -q "requireAdministrator" src-tauri/target/debug/padflow.exe; then
            echo "FAIL - debug exe should NOT be elevated but contains requireAdministrator"
            exit 1
          else
            echo "OK - debug exe stays unelevated"
          fi

  # Deep deterministic fuzzing of the HID parsers and CRC-32. Kept as a
  # separate job so the manifest checks stay fast; runs the #[ignore]d
  # deep_fuzz test (500k parser buffers + 200k CRC combos) explicitly.
  # Debug profile: the release profile sets panic="abort", which would break
  # the catch_unwind-based crash recording.
  deep-fuzz:
    name: Deep fuzz (parsers + CRC-32)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # tauri::generate_context!() embeds ../dist at compile time, so the
      # frontend must exist before the Rust test build (same as manifest-check).
      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Run deep fuzz (500k parser buffers + 200k CRC combos)
        working-directory: src-tauri
        run: cargo test -- --ignored deep_fuzz_500k_parsers_and_crc
