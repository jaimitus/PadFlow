name: Release - publish signed binaries

# Trigger: pushing a version tag (v1.3.0, v1.2.4, ...) or running manually
# with a tag input. The tag version must match tauri.conf.json / Cargo.toml /
# package.json — the workflow verifies all three before building.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to release (e.g. v1.2.4). Must match tauri.conf.json, Cargo.toml and package.json."
        required: true

permissions:
  contents: write

jobs:
  # Release gate: run the full deterministic fuzz suite (500k parser
  # buffers + 200k CRC combos + 200k hot-loop reports) BEFORE anything is
  # published. Runs in parallel with the release build; if it fails, the
  # release never goes out.
  deep-fuzz:
    name: Deep fuzz (release gate)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # tauri::generate_context!() embeds ../dist at compile time, so the
      # frontend must exist before the Rust test build (same as manifest-check).
      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Run deep fuzz (500k parsers + 200k CRC + 200k hot loop)
        working-directory: src-tauri
        run: cargo test -- --ignored deep_fuzz_500k_parsers_and_crc

  release:
    name: Build, sign & publish ${{ inputs.tag || github.ref_name }}
    # Gate: never publish until the deep fuzz suite passes.
    needs: deep-fuzz
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Derive version from tag
        id: version
        shell: bash
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          case "$TAG" in
            v*.*.*) ;;
            *) echo "FAIL - invalid release tag: '$TAG' (expected v*.*.*)"; exit 1 ;;
          esac
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches all version sources
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"
          CONF=$(node -p "require('./src-tauri/tauri.conf.json').version")
          PKG=$(node -p "require('./package.json').version")
          CARGO=$(grep -m1 '^version' src-tauri/Cargo.toml | sed 's/^version *= *"\(.*\)"/\1/')
          for PAIR in "tauri.conf.json:$CONF" "package.json:$PKG" "Cargo.toml:$CARGO"; do
            NAME="${PAIR%%:*}"; VAL="${PAIR#*:}"
            if [ "$VAL" != "$VERSION" ]; then
              echo "FAIL - tag is $TAG but $NAME says $VAL. Bump versions first."
              exit 1
            fi
          done
          echo "OK - tag $TAG matches tauri.conf.json, package.json and Cargo.toml"

      # Runs beforeBuildCommand (npm run build) automatically, then builds the
      # signed NSIS + MSI bundles plus the updater artifacts (.sig files).
      # Note: package.json has no `tauri` script, so npx resolves the local
      # @tauri-apps/cli devDependency — do NOT switch to `npm run tauri build`.
      - name: Build signed bundles (NSIS + MSI + updater artifacts)
        working-directory: src-tauri
        run: npx tauri build

      - name: Verify requireAdministrator manifest in release exe
        shell: bash
        run: |
          test -f src-tauri/target/release/padflow.exe \
            || { echo "FAIL - release exe was not built"; exit 1; }
          grep -a -q "requireAdministrator" src-tauri/target/release/padflow.exe \
            || { echo "FAIL - elevated manifest missing from release exe"; exit 1; }
          echo "OK - release exe is elevated"

      - name: Generate latest.json update manifest
        id: manifest
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          SIG_FILE="src-tauri/target/release/bundle/nsis/PadFlow_${VERSION}_x64-setup.exe.sig"
          test -f "$SIG_FILE" || { echo "FAIL - updater signature missing: $SIG_FILE"; exit 1; }
          SIG=$(tr -d '\n' < "$SIG_FILE")
          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          printf '{\n  "version": "%s",\n  "notes": "PadFlow v%s — published automatically by GitHub Actions",\n  "pub_date": "%s",\n  "platforms": {\n    "windows-x86_64": {\n      "signature": "%s",\n      "url": "https://github.com/%s/releases/download/%s/PadFlow_%s_x64-setup.exe"\n    }\n  }\n}\n' "$VERSION" "$VERSION" "$PUB_DATE" "$SIG" "${GITHUB_REPOSITORY}" "${{ steps.version.outputs.tag }}" "$VERSION" > latest.json
          node -e 'JSON.parse(require("fs").readFileSync("latest.json","utf8")); console.log("OK - latest.json valid")'

      # Rename to a stable public name BEFORE uploading: gh's `file#label`
      # syntax does NOT survive MSYS argument mangling on Windows runners.
      - name: Prepare portable exe
        shell: bash
        run: |
          test -f src-tauri/target/release/padflow.exe \
            || { echo "FAIL - release exe was not built"; exit 1; }
          cp src-tauri/target/release/padflow.exe PadFlow-Portable.exe
          echo "OK - portable exe prepared"

      - name: Create GitHub release with all assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"
          if [ -f RELEASE_NOTES.md ]; then NOTES_ARGS="--notes-file RELEASE_NOTES.md"; else NOTES_ARGS="--generate-notes"; fi
          gh release create "$TAG" \
            "src-tauri/target/release/bundle/nsis/PadFlow_${VERSION}_x64-setup.exe" \
            "src-tauri/target/release/bundle/nsis/PadFlow_${VERSION}_x64-setup.exe.sig" \
            "src-tauri/target/release/bundle/msi/PadFlow_${VERSION}_x64_en-US.msi" \
            "src-tauri/target/release/bundle/msi/PadFlow_${VERSION}_x64_en-US.msi.sig" \
            "PadFlow-Portable.exe" \
            "latest.json" \
            --title "PadFlow v${VERSION} 🚀" $NOTES_ARGS

      - name: Verify published assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          COUNT=$(gh release view "${{ steps.version.outputs.tag }}" --json assets --jq '[.assets[].name] | length')
          echo "published assets: $COUNT"
          [ "$COUNT" -ge 6 ] || { echo "FAIL - expected 6 assets (nsis, nsis.sig, msi, msi.sig, portable, latest.json), got $COUNT"; exit 1; }
          echo "OK - all 6 assets published"

      # Keep CHANGELOG.md in sync right here, inside the pipeline: the
      # `release: published` webhook is NOT reliably delivered for releases
      # created with GITHUB_TOKEN from a workflow, so we do it in-band.
      - name: Update CHANGELOG.md (auto-changelog)
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Work on the default branch so the entry lands on main.
          git fetch origin main
          git checkout -B main origin/main

          VERSION="${TAG#v}"
          DATE=$(date -u +%Y-%m-%d)

          test -f CHANGELOG.md || { echo "FAIL - CHANGELOG.md not found in repo"; exit 1; }

          # Idempotency: skip when an entry for this version already exists.
          if grep -Fq "## [${VERSION}]" CHANGELOG.md; then
            echo "OK - CHANGELOG.md already has an entry for v${VERSION}, skipping"
            exit 0
          fi

          # Fetch the release body via the API; empty bodies become "".
          NOTES=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq '.body // ""')
          # Drop a leading markdown title line — the version is in the heading.
          NOTES=$(printf '%s\n' "$NOTES" | awk 'NR==1 && /^# / { next } { print }')

          {
            printf '## [%s] - %s\n\n' "$VERSION" "$DATE"
            printf '%s\n' "$NOTES"
            printf '\n---\n\n'
            cat CHANGELOG.md
          } > CHANGELOG.tmp
          mv CHANGELOG.tmp CHANGELOG.md

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "docs: add changelog entry for ${TAG}"
          git pull --rebase origin main
          git push origin main
          echo "OK - CHANGELOG.md updated on main"
