# ---- Virtual Xbox 360 / Xbox One pad via ViGEmBus -------------------------
vigem-client = "0.1.4"

# ---- Raw HID access for DualShock 4 / DualSense (USB + Bluetooth) ---------
hidapi = { version = "2.6.3", default-features = false, features = ["windows-native"] }

# ---- XInput / generic pad discovery fallback ------------------------------
gilrs = "0.11.0"

# ---- Utility --------------------------------------------------------------
parking_lot = "0.12.3"
once_cell = "1.20.2"
thiserror = "2.0.6"
log = "0.4.22"
env_logger = "0.11.5"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58.0", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_Media",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_Security",
    "Win32_System_ProcessStatus",
] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
`,Wg=`//! PadFlow — DualShock 4 / DualSense HID ingestion, response-curve math and
//! ViGEmBus virtual Xbox 360 target mapping.
//!
//! Design goals
//! ------------
//! * **Zero allocation in the hot loop.** Every buffer is pre-allocated; the
//!   polling thread never touches the heap while a pad is streaming.
//! * **Sub-millisecond end-to-end latency.** The HID read is blocking with a
//!   1 ms timeout, the ViGEm submit happens immediately after the parse, and
//!   the UI event is throttled to 60 Hz so the renderer never back-pressures
//!   the input path.
//! * **Crash-proof hot-plug.** Every hardware error degrades to a clean
//!   \`Disconnected\` state; the supervisor re-enumerates every 750 ms and
//!   re-attaches the same virtual target without dropping the ViGEm handle.

use std::collections::HashMap;
use std::sync::atomic::{AtomicBool, AtomicU32, AtomicU64, Ordering};
use std::sync::Arc;
use std::time::{Duration, Instant};

use parking_lot::{Mutex, RwLock};
use serde::{Deserialize, Serialize};

pub const VID_SONY: u16 = 0x054C;
pub const PID_DS4_V1: u16 = 0x05C4;
pub const PID_DS4_V2: u16 = 0x09CC;
pub const PID_DS4_DONGLE: u16 = 0x0BA0;
pub const PID_DUALSENSE: u16 = 0x0CE6;
pub const PID_DUALSENSE_EDGE: u16 = 0x0DF2;

/// Which Sony (or generic) pad family we are talking to.
#[derive(Debug, Clone, Copy, PartialEq, Eq, Serialize, Deserialize)]
#[serde(rename_all = "camelCase")]
pub enum PadKind {
    DualShock4,
    DualSense,
    DualSenseEdge,
    XInput,
    Generic,
}

impl PadKind {
    pub fn from_ids(vid: u16, pid: u16) -> Self {
        match (vid, pid) {
            (VID_SONY, PID_DS4_V1) | (VID_SONY, PID_DS4_V2) | (VID_SONY, PID_DS4_DONGLE) => {
                PadKind::DualShock4
            }
            (VID_SONY, PID_DUALSENSE) => PadKind::DualSense,
            (VID_SONY, PID_DUALSENSE_EDGE) => PadKind::DualSenseEdge,
            _ => PadKind::Generic,
        }
    }

    pub fn label(&self) -> &'static str {
        match self {
            PadKind::DualShock4 => "DualShock 4",
            PadKind::DualSense => "DualSense",
            PadKind::DualSenseEdge => "DualSense Edge",
            PadKind::XInput => "XInput Controller",
            PadKind::Generic => "Generic HID Pad",
        }
    }

    pub fn has_lightbar(&self) -> bool {
        matches!(
            self,
            PadKind::DualShock4 | PadKind::DualSense | PadKind::DualSenseEdge
        )
    }
}

// ---------------------------------------------------------------------------
// Response-curve mathematics
// ---------------------------------------------------------------------------

#[inline(always)]
fn clamp01(v: f32) -> f32 {
    if v < 0.0 {
        0.0
    } else if v > 1.0 {
        1.0
    } else {
        v
    }
}

/// AI-optimized curve parameters based on playstyle analysis.
/// Returns optimized (curve_kind, power) tuple.
pub fn ai_optimize_curve(
    input_samples: &[f32],
    target_samples: &[f32],
    learning_rate: f32,
) -> (CurveKind, f32) {
    if input_samples.is_empty() || target_samples.is_empty() || learning_rate <= 0.0 {
        return (CurveKind::Linear, 1.0);
    }

    // Simple heuristic: analyze input/output ratio distribution
    let mut avg_ratio = 0.0f32;
    let mut sample_count = 0;
    
    for (&input, &target) in input_samples.iter().zip(target_samples.iter()) {
        if input > 0.01 && target > 0.01 {
            avg_ratio += target / input;
            sample_count += 1;
        }
    }

    if sample_count == 0 {
        return (CurveKind::Linear, 1.0);
    }

    avg_ratio /= sample_count as f32;

    // Determine curve type based on ratio distribution
    let (kind, base_power) = if avg_ratio < 0.8 {
        // User applies more force than needed → softer curve
        (CurveKind::Exponential, 0.7)
    } else if avg_ratio > 1.3 {
        // User needs more output → aggressive curve
        (CurveKind::Aggressive, 1.5)
    } else if avg_ratio > 1.1 {
        // Slight boost needed → S-curve
        (CurveKind::SCurve, 1.2)
    } else {
        // Balanced → linear
        (CurveKind::Linear, 1.0)
    };

    // Apply learning rate for gradual adaptation
    let adjusted_power = 1.0 + (base_power - 1.0) * learning_rate.clamp(0.0, 1.0);
    
    (kind, adjusted_power.clamp(0.5, 4.0))
}

/// Maps a normalised magnitude \`t\` (0..=1) through the selected curve.
///
/// * \`Linear\`      — \`t\`
/// * \`Exponential\` — \`t^p\` (precision near centre, punchy at the edge)
/// * \`SCurve\`      — smoothstep blended by \`p\` (stable centre, fast flicks)
/// * \`Aggressive\`  — inverse-exponential, instant response for arcade & vehicle titles
#[inline(always)]
pub fn apply_curve(t: f32, kind: CurveKind, power: f32) -> f32 {
    let t = clamp01(t);
    let p = power.clamp(0.5, 4.0);
    match kind {
        CurveKind::Linear => t,
        CurveKind::Exponential => t.powf(p),
        CurveKind::SCurve => {
            let s = t * t * (3.0 - 2.0 * t); // smoothstep
            let k = ((p - 1.0) / 3.0).clamp(0.0, 1.0);
            t * (1.0 - k) + s * k * (1.0 + (p - 1.0) * 0.15).min(1.35)
        }
        CurveKind::Aggressive => {
            // 1 - (1 - t)^p : very fast off-centre ramp, saturates smoothly.
            1.0 - (1.0 - t).powf(p)
        }
    }
    .clamp(0.0, 1.0)
}

/// Full stick shaping pipeline: deadzone → curve → anti-deadzone →
/// sensitivity → clamp. Returns the shaped \`(x, y)\` pair.
#[inline(always)]
pub fn shape_stick(x: f32, y: f32, p: &StickAxisProfile) -> (f32, f32) {
    let y = if p.invert_y { -y } else { y };

    if p.radial {
        let mag = (x * x + y * y).sqrt();
        if mag <= f32::EPSILON {
            return (0.0, 0.0);
        }
        let inner = p.inner_deadzone.clamp(0.0, 0.9);
        let outer = p.outer_deadzone.clamp(inner + 0.02, 1.0);
        if mag <= inner {
            return (0.0, 0.0);
        }
        let mut t = ((mag - inner) / (outer - inner)).min(1.0);
        t = apply_curve(t, p.curve, p.curve_power);
        let anti = p.anti_deadzone.clamp(0.0, 0.6);
        if t > 0.0 {
            t = anti + t * (1.0 - anti);
        }
        t = (t * p.sensitivity.clamp(0.25, 3.0)).min(1.0);
        let nx = x / mag;
        let ny = y / mag;
        (nx * t, ny * t)
    } else {
        (shape_axis(x, p), shape_axis(y, p))
    }
}

#[inline(always)]
fn shape_axis(v: f32, p: &StickAxisProfile) -> f32 {
    let sign = if v < 0.0 { -1.0 } else { 1.0 };
    let mag = v.abs();
    let inner = p.inner_deadzone.clamp(0.0, 0.9);
    let outer = p.outer_deadzone.clamp(inner + 0.02, 1.0);
    if mag <= inner {
        return 0.0;
    }
    let mut t = ((mag - inner) / (outer - inner)).min(1.0);
    t = apply_curve(t, p.curve, p.curve_power);
    let anti = p.anti_deadzone.clamp(0.0, 0.6);
    if t > 0.0 {
        t = anti + t * (1.0 - anti);
    }
    t = (t * p.sensitivity.clamp(0.25, 3.0)).min(1.0);
    sign * t
}

#[inline(always)]
pub fn shape_trigger(v: f32, p: &TriggerProfile) -> f32 {
    let inner = p.inner_deadzone.clamp(0.0, 0.8);
    let outer = p.outer_deadzone.clamp(inner + 0.02, 1.0);
    if v <= inner {
        0.0
    } else if p.hair_trigger {
        1.0
    } else {
        ((v - inner) / (outer - inner)).min(1.0)
    }
}

#[inline(always)]
fn u8_to_axis(v: u8) -> f32 {
    // 0..255 with 128 as centre → -1.0..=1.0
    (v as f32 - 127.5) / 127.5
}

// ---------------------------------------------------------------------------
// Raw HID report parsing
// ---------------------------------------------------------------------------

#[derive(Debug, Clone, Copy, Default)]
struct RawState {
    lx: f32,
    ly: f32,
    rx: f32,
    ry: f32,
    l2: f32,
    r2: f32,
    buttons: u32,
    dpad: u8,
    battery: i16,
    charging: bool,
    gyro: [f32; 3],
    accel: [f32; 3],
    touch: [[f32; 2]; 2],
    touch_count: u8,
}

#[inline(always)]
fn le_i16(b: &[u8], i: usize) -> i16 {
    i16::from_le_bytes([b[i], b[i + 1]])
}

/// DualShock 4 — USB report \`0x01\` (64 B) / Bluetooth report \`0x11\` (78 B).
fn parse_ds4(buf: &[u8], bt: bool) -> Option<RawState> {
    let o = if bt { 3usize } else { 1usize };
    if buf.len() < o + 9 {
        return None;
    }
    let mut s = RawState::default();
    s.lx = u8_to_axis(buf[o]);
    s.ly = -u8_to_axis(buf[o + 1]);
    s.rx = u8_to_axis(buf[o + 2]);
    s.ry = -u8_to_axis(buf[o + 3]);

    let b1 = buf[o + 4];
    let b2 = buf[o + 5];
    let b3 = buf[o + 6];
    s.dpad = b1 & 0x0F;
    let mut m = 0u32;
    if b1 & 0x10 != 0 {
        m |= buttons::SQUARE;
    }
    if b1 & 0x20 != 0 {
        m |= buttons::CROSS;
    }
    if b1 & 0x40 != 0 {
        m |= buttons::CIRCLE;
    }
    if b1 & 0x80 != 0 {
        m |= buttons::TRIANGLE;
    }
    if b2 & 0x01 != 0 {
        m |= buttons::L1;
    }
    if b2 & 0x02 != 0 {
        m |= buttons::R1;
    }
    if b2 & 0x04 != 0 {
        m |= buttons::L2;
    }
    if b2 & 0x08 != 0 {
        m |= buttons::R2;
    }
    if b2 & 0x10 != 0 {
        m |= buttons::SHARE;
    }
    if b2 & 0x20 != 0 {
        m |= buttons::OPTIONS;
    }
    if b2 & 0x40 != 0 {
        m |= buttons::L3;
    }
    if b2 & 0x80 != 0 {
        m |= buttons::R3;
    }
    if b3 & 0x01 != 0 {
        m |= buttons::PS;
    }
    if b3 & 0x02 != 0 {
        m |= buttons::TOUCHPAD;
    }
    s.buttons = m;

    s.l2 = buf[o + 7] as f32 / 255.0;
    s.r2 = buf[o + 8] as f32 / 255.0;

    // Motion block (gyro pitch/yaw/roll then accel x/y/z), 16-bit LE.
    if buf.len() >= o + 25 {
        s.gyro = [
            le_i16(buf, o + 12) as f32 / 1024.0,
            le_i16(buf, o + 14) as f32 / 1024.0,
            le_i16(buf, o + 16) as f32 / 1024.0,
        ];
        s.accel = [
            le_i16(buf, o + 18) as f32 / 8192.0,
            le_i16(buf, o + 20) as f32 / 8192.0,
            le_i16(buf, o + 22) as f32 / 8192.0,
        ];
    }

    // Battery nibble: 0..10 on USB (bit 4 = cable), 0..8 on Bluetooth.
    if buf.len() >= o + 30 {
        let raw_bat = buf[o + 29];
        let cable = raw_bat & 0x10 != 0;
        let level = (raw_bat & 0x0F) as i16;
        s.charging = cable;
        s.battery = if cable {
            ((level.min(11) as f32 / 11.0) * 100.0) as i16
        } else {
            ((level.min(8) as f32 / 8.0) * 100.0) as i16
        };
    } else {
        s.battery = -1;
    }

    // Touchpad: first finger at +34, second at +38 (12-bit packed X/Y).
    if buf.len() >= o + 42 {
        let base = o + 34;
        for f in 0..2usize {
            let p = base + f * 4;
            if buf[p] & 0x80 == 0 {
                let x = (((buf[p + 2] as u16 & 0x0F) << 8) | buf[p + 1] as u16) as f32 / 1919.0;
                let y = (((buf[p + 3] as u16) << 4) | ((buf[p + 2] as u16 & 0xF0) >> 4)) as f32
                    / 942.0;
                s.touch[f] = [x.clamp(0.0, 1.0), y.clamp(0.0, 1.0)];
                s.touch_count += 1;
            }
        }
    }
    Some(s)
}

/// DualSense / DualSense Edge — USB report \`0x01\` (64 B) / BT report \`0x31\` (78 B).
fn parse_dualsense(buf: &[u8], bt: bool) -> Option<RawState> {
    let o = if bt { 2usize } else { 1usize };
    if buf.len() < o + 9 {
        return None;
    }
    let mut s = RawState::default();
    s.lx = u8_to_axis(buf[o]);
    s.ly = -u8_to_axis(buf[o + 1]);
    s.rx = u8_to_axis(buf[o + 2]);
    s.ry = -u8_to_axis(buf[o + 3]);
    s.l2 = buf[o + 4] as f32 / 255.0;
    s.r2 = buf[o + 5] as f32 / 255.0;

    let b1 = buf[o + 7];
    let b2 = buf[o + 8];
    let b3 = buf[o + 9];
    s.dpad = b1 & 0x0F;
    let mut m = 0u32;
    if b1 & 0x10 != 0 {
        m |= buttons::SQUARE;
    }
    if b1 & 0x20 != 0 {
        m |= buttons::CROSS;
    }
    if b1 & 0x40 != 0 {
        m |= buttons::CIRCLE;
    }
    if b1 & 0x80 != 0 {
        m |= buttons::TRIANGLE;
    }
    if b2 & 0x01 != 0 {
        m |= buttons::L1;
    }
    if b2 & 0x02 != 0 {
        m |= buttons::R1;
    }
    if b2 & 0x04 != 0 {
        m |= buttons::L2;
    }
    if b2 & 0x08 != 0 {
        m |= buttons::R2;
    }
    if b2 & 0x10 != 0 {
        m |= buttons::SHARE;
    }
    if b2 & 0x20 != 0 {
        m |= buttons::OPTIONS;
    }
    if b2 & 0x40 != 0 {
        m |= buttons::L3;
    }
    if b2 & 0x80 != 0 {
        m |= buttons::R3;
    }
    if b3 & 0x01 != 0 {
        m |= buttons::PS;
    }
    if b3 & 0x02 != 0 {
        m |= buttons::TOUCHPAD;
    }
    if b3 & 0x04 != 0 {
        m |= buttons::MUTE;
    }
    s.buttons = m;

    if buf.len() >= o + 26 {
        s.gyro = [
            le_i16(buf, o + 15) as f32 / 1024.0,
            le_i16(buf, o + 17) as f32 / 1024.0,
            le_i16(buf, o + 19) as f32 / 1024.0,
        ];
        s.accel = [
            le_i16(buf, o + 21) as f32 / 8192.0,
            le_i16(buf, o + 23) as f32 / 8192.0,
            le_i16(buf, o + 25) as f32 / 8192.0,
        ];
    }

    if buf.len() >= o + 42 {
        let base = o + 32;
        for f in 0..2usize {
            let p = base + f * 4;
            if buf[p] & 0x80 == 0 {
                let x = (((buf[p + 2] as u16 & 0x0F) << 8) | buf[p + 1] as u16) as f32 / 1919.0;
                let y = (((buf[p + 3] as u16) << 4) | ((buf[p + 2] as u16 & 0xF0) >> 4)) as f32
                    / 1079.0;
                s.touch[f] = [x.clamp(0.0, 1.0), y.clamp(0.0, 1.0)];
                s.touch_count += 1;
            }
        }
    }

    if buf.len() > o + 52 {
        let status = buf[o + 52];
        let level = (status & 0x0F) as i16;
        let state = (status & 0xF0) >> 4;
        s.charging = state == 0x01 || state == 0x02;
        s.battery = ((level.min(8) as f32 / 8.0) * 100.0) as i16;
    } else {
        s.battery = -1;
    }
    Some(s)
}

// Output reports (lightbar + rumble)
// ---------------------------------------------------------------------------

/// CRC-32 (IEEE, reflected) used by the Bluetooth output reports.
fn crc32(seed: &[u8], data: &[u8]) -> u32 {
    let mut crc: u32 = 0xFFFF_FFFF;
    for byte in seed.iter().chain(data.iter()) {
        crc ^= *byte as u32;
        for _ in 0..8 {
            let mask = (crc & 1).wrapping_neg();
            crc = (crc >> 1) ^ (0xEDB8_8320 & mask);
        }
    }
    !crc
}

/// Builds and writes the lightbar / rumble output report for the pad.
///
/// \`rumble\` is \`(weak, strong)\` normalised \`0.0..=1.0\`.
pub fn write_output_report(
    device: &HidDevice,
    kind: PadKind,
    connection: ConnectionType,
    led: [u8; 3],
    rumble: (f32, f32),
) -> Result<(), String> {
    let weak = (rumble.0.clamp(0.0, 1.0) * 255.0) as u8;
    let strong = (rumble.1.clamp(0.0, 1.0) * 255.0) as u8;

    match (kind, connection) {
        (PadKind::DualShock4, ConnectionType::Usb) => {
            let mut buf = [0u8; 32];
            buf[0] = 0x05; // report id
            buf[1] = 0xF7; // enable rumble + lightbar + blink
            buf[4] = weak;
            buf[5] = strong;
            buf[6] = led[0];
            buf[7] = led[1];
            buf[8] = led[2];
            device.write(&buf).map_err(|e| e.to_string())?;
        }
        (PadKind::DualShock4, ConnectionType::Bluetooth) => {
            let mut buf = [0u8; 78];
            buf[0] = 0x11;
            buf[1] = 0xC0; // poll rate 1000 Hz
            buf[2] = 0x20;
            buf[3] = 0xF7;
            buf[6] = weak;
            buf[7] = strong;
            buf[8] = led[0];
            buf[9] = led[1];
            buf[10] = led[2];
            let crc = crc32(&[0xA2], &buf[..74]);
            buf[74..78].copy_from_slice(&crc.to_le_bytes());
            device.write(&buf).map_err(|e| e.to_string())?;
        }
        (PadKind::DualSense, ConnectionType::Usb) | (PadKind::DualSenseEdge, ConnectionType::Usb) => {
            let mut buf = [0u8; 48];
            buf[0] = 0x02; // report id
            buf[1] = 0xFF; // valid flag 0: rumble + right trigger
            buf[2] = 0xF7; // valid flag 1: lightbar + player LEDs + mic LED
            buf[3] = weak;
            buf[4] = strong;
            buf[45] = led[0];
            buf[46] = led[1];
            buf[47] = led[2];
            device.write(&buf).map_err(|e| e.to_string())?;
        }
        (PadKind::DualSense, ConnectionType::Bluetooth)
        | (PadKind::DualSenseEdge, ConnectionType::Bluetooth) => {
            let mut buf = [0u8; 78];
            buf[0] = 0x31; // BT output report
            buf[1] = 0x02; // sequence tag / feature flag
            buf[2] = 0xFF;
            buf[3] = 0xF7;
            buf[4] = weak;
            buf[5] = strong;
            buf[46] = led[0];
            buf[47] = led[1];
            buf[48] = led[2];
            let crc = crc32(&[0xA2], &buf[..74]);
            buf[74..78].copy_from_slice(&crc.to_le_bytes());
            device.write(&buf).map_err(|e| e.to_string())?;
        }
        _ => return Err("This controller has no addressable lightbar".into()),
    }
    Ok(())
}

// ---------------------------------------------------------------------------
// Device discovery
// ---------------------------------------------------------------------------

fn connection_of(info: &DeviceInfo) -> ConnectionType {
    if info.interface_number() == -1 || info.path().to_string_lossy().to_lowercase().contains("bthenum") {
        ConnectionType::Bluetooth
    } else {
        ConnectionType::Usb
    }
}

fn stable_id(info: &DeviceInfo, index: usize) -> String {
    match info.serial_number() {
        Some(sn) if !sn.is_empty() => format!("{:04x}:{:04x}:{}", info.vendor_id(), info.product_id(), sn),
        _ => format!("{:04x}:{:04x}:#{index}", info.vendor_id(), info.product_id()),
    }
}

/// Enumerates every supported pad currently attached to the machine.
pub fn enumerate(api: &HidApi, cache: &HashMap<String, [u8; 3]>) -> Vec<GamepadInfo> {
    let mut out = Vec::new();
    let mut seen_paths = std::collections::HashSet::new();
    for (idx, info) in api.device_list().enumerate() {
        let kind = PadKind::from_ids(info.vendor_id(), info.product_id());
        if kind == PadKind::Generic {
            continue;
        }
        // Sony pads publish several HID collections; only usage page 0x01 /
        // usage 0x05 (gamepad) or 0x04 (joystick) carries the input reports.
        if info.usage_page() != 0 && !(info.usage_page() == 0x01 && (info.usage() == 0x05 || info.usage() == 0x04)) {
            continue;
        }
        let path_str = info.path().to_string_lossy().to_string();
        if !seen_paths.insert(path_str.clone()) {
            continue;
        }
        let id = stable_id(info, idx);
        let connection = connection_of(info);
        let led = cache.get(&id).copied().unwrap_or(match kind {
            PadKind::DualShock4 => [0, 40, 255],
            _ => [0, 140, 255],
        });
        out.push(GamepadInfo {
            name: info
                .product_string()
                .map(|s| s.to_string())
                .unwrap_or_else(|| kind.label().to_string()),
            kind,
            connection,
            battery: -1,
            charging: matches!(connection, ConnectionType::Usb),
            led,
            vendor_id: info.vendor_id(),
            product_id: info.product_id(),
            serial: info.serial_number().unwrap_or_default().to_string(),
            path: path_str,
            has_lightbar: kind.has_lightbar(),
            has_gyro: true,
            has_touchpad: true,
            report_rate_hz: match connection {
                ConnectionType::Usb => 1000,
                ConnectionType::Bluetooth => 800,
            },
            id,
        });
    }
    out
}

/// Shared, lock-light engine state. Cloneable handle (\`Arc\` inside).
#[derive(Clone)]
pub struct PadFlowEngine {
    inner: Arc<EngineInner>,
}

struct EngineInner {
    default_profile: RwLock<StickProfileConfig>,
    device_profiles: RwLock<HashMap<String, StickProfileConfig>>,
    running: AtomicBool,
    virtual_online: AtomicBool,
    polls: AtomicU64,
    dropped: AtomicU64,
    reconnects: AtomicU32,
    poll_hz: AtomicU32,
    avg_latency_us: AtomicU32,
    peak_latency_us: AtomicU32,
    /// \`pad_id -> rgb\` written by \`set_led_color\`, consumed by the poll thread.
    led_requests: Mutex<HashMap<String, [u8; 3]>>,
    led_state: RwLock<HashMap<String, [u8; 3]>>,
    rumble_request: Mutex<Option<(f32, f32)>>,
    devices: RwLock<Vec<GamepadInfo>>,
    last_snapshot: RwLock<InputSnapshot>,
    last_snapshots: RwLock<HashMap<String, InputSnapshot>>,
    active_pad: RwLock<Option<String>>,
    /// Performance optimization state
    adaptive_polling_active: AtomicBool,
    target_poll_hz: AtomicU32,
    current_poll_hz: AtomicU32,
    batch_reports_active: AtomicBool,
    reports_batched: AtomicU64,
    batch_size_total: AtomicU64,
    batch_count: AtomicU64,
    cpu_usage_percent: AtomicU32, // stored as integer * 100 for precision
    thread_priority: Mutex<String>,
    /// AI curve optimization state
    ai_optimization_active: AtomicBool,
    ai_confidence_score: AtomicU32, // stored as u32 * 1000 for precision
    ai_samples_collected: AtomicU32,
    ai_samples_target: AtomicU32,
    ai_analysis_complete: AtomicBool,
    ai_sample_buffer: Mutex<Vec<(f32, f32, u64)>>, // (input, output, timestamp)
}

impl Default for PadFlowEngine {
    fn default() -> Self {
        Self::new()
    }
}

impl PadFlowEngine {
    pub fn new() -> Self {
        Self {
            inner: Arc::new(EngineInner {
                default_profile: RwLock::new(StickProfileConfig::default()),
                device_profiles: RwLock::new(HashMap::new()),
                running: AtomicBool::new(false),
                virtual_online: AtomicBool::new(false),
                polls: AtomicU64::new(0),
                dropped: AtomicU64::new(0),
                reconnects: AtomicU32::new(0),
                poll_hz: AtomicU32::new(0),
                avg_latency_us: AtomicU32::new(0),
                peak_latency_us: AtomicU32::new(0),
                led_requests: Mutex::new(HashMap::new()),
                led_state: RwLock::new(HashMap::new()),
                rumble_request: Mutex::new(None),
                devices: RwLock::new(Vec::new()),
                last_snapshot: RwLock::new(InputSnapshot::default()),
                last_snapshots: RwLock::new(HashMap::new()),
                active_pad: RwLock::new(None),
                // Performance optimization state
                adaptive_polling_active: AtomicBool::new(true),
                target_poll_hz: AtomicU32::new(1000),
                current_poll_hz: AtomicU32::new(1000),
                batch_reports_active: AtomicBool::new(true),
                reports_batched: AtomicU64::new(0),
                batch_size_total: AtomicU64::new(0),
                batch_count: AtomicU64::new(0),
                cpu_usage_percent: AtomicU32::new(0),
                thread_priority: Mutex::new("Normal".to_string()),
                // AI curve optimization state
                ai_optimization_active: AtomicBool::new(false),
                ai_confidence_score: AtomicU32::new(0),
                ai_samples_collected: AtomicU32::new(0),
                ai_samples_target: AtomicU32::new(500),
                ai_analysis_complete: AtomicBool::new(false),
                ai_sample_buffer: Mutex::new(Vec::with_capacity(500)),
            }),
        }
    }

    pub fn is_running(&self) -> bool {
        self.inner.running.load(Ordering::Relaxed)
    }

    pub fn profile(&self) -> StickProfileConfig {
        self.profile_for(None)
    }

    pub fn profile_for(&self, pad_id: Option<&str>) -> StickProfileConfig {
        let profiles = self.inner.device_profiles.read();
        if let Some(id) = pad_id {
            if let Some(p) = profiles.get(id) {
                return *p;
            }
        } else if let Some(ref active_id) = *self.inner.active_pad.read() {
            if let Some(p) = profiles.get(active_id) {
                return *p;
            }
        }
        *self.inner.default_profile.read()
    }

    pub fn all_profiles(&self) -> HashMap<String, StickProfileConfig> {
        self.inner.device_profiles.read().clone()
    }

    pub fn set_profile(&self, p: StickProfileConfig) {
        self.set_profile_for(None, p);
    }

    pub fn set_profile_for(&self, pad_id: Option<&str>, p: StickProfileConfig) {
        *self.inner.default_profile.write() = p;
        if let Some(id) = pad_id {
            self.inner.device_profiles.write().insert(id.to_string(), p);
        } else if let Some(ref active_id) = *self.inner.active_pad.read() {
            self.inner.device_profiles.write().insert(active_id.clone(), p);
        }
    }

    pub fn devices(&self) -> Vec<GamepadInfo> {
        self.inner.devices.read().clone()
    }

    pub fn set_active_pad(&self, pad_id: &str) {
        *self.inner.active_pad.write() = Some(pad_id.to_string());
    }

    pub fn active_pad(&self) -> Option<String> {
        self.inner.active_pad.read().clone()
    }

    pub fn snapshot(&self) -> InputSnapshot {
        self.inner.last_snapshot.read().clone()
    }

    pub fn snapshot_for(&self, pad_id: Option<&str>) -> InputSnapshot {
        let snaps = self.inner.last_snapshots.read();
        if let Some(id) = pad_id {
            if let Some(s) = snaps.get(id) {
                return s.clone();
            }
        }
        if let Some(ref active_id) = *self.inner.active_pad.read() {
            if let Some(s) = snaps.get(active_id) {
                return s.clone();
            }
        }
        self.inner.last_snapshot.read().clone()
    }

    pub fn queue_led(&self, pad_id: &str, rgb: [u8; 3]) {
        self.inner.led_requests.lock().insert(pad_id.to_string(), rgb);
        self.inner.led_state.write().insert(pad_id.to_string(), rgb);
        if let Some(d) = self
            .inner
            .devices
            .write()
            .iter_mut()
            .find(|d| d.id == pad_id)
        {
            d.led = rgb;
        }
    }

    pub fn queue_rumble(&self, weak: f32, strong: f32) {
        *self.inner.rumble_request.lock() = Some((weak, strong));
    }

    pub fn stats(&self) -> EngineStats {
        let i = &self.inner;
        let batch_count = i.batch_count.load(Ordering::Relaxed);
        let batch_size_total = i.batch_size_total.load(Ordering::Relaxed);
        let batch_size_avg = if batch_count > 0 {
            batch_size_total as f32 / batch_count as f32
        } else {
            1.0
        };
        EngineStats {
            running: i.running.load(Ordering::Relaxed),
            virtual_pad_online: i.virtual_online.load(Ordering::Relaxed),
            polls: i.polls.load(Ordering::Relaxed),
            poll_hz: i.poll_hz.load(Ordering::Relaxed),
            avg_latency_us: i.avg_latency_us.load(Ordering::Relaxed),
            peak_latency_us: i.peak_latency_us.load(Ordering::Relaxed),
            dropped_reports: i.dropped.load(Ordering::Relaxed),
            reconnects: i.reconnects.load(Ordering::Relaxed),
            driver: "ViGEmBus / Xbox 360 Controller".into(),
            battery_level: self.get_battery_level(),
            ai_optimization_active: i.ai_optimization_active.load(Ordering::Relaxed),
            ai_confidence_score: i.ai_confidence_score.load(Ordering::Relaxed) as f32 / 1000.0,
            adaptive_polling_active: i.adaptive_polling_active.load(Ordering::Relaxed),
            target_poll_hz: i.target_poll_hz.load(Ordering::Relaxed),
            current_poll_hz: i.current_poll_hz.load(Ordering::Relaxed),
            batch_reports_active: i.batch_reports_active.load(Ordering::Relaxed),
            reports_batched: i.reports_batched.load(Ordering::Relaxed),
            batch_size_avg,
            cpu_usage_percent: i.cpu_usage_percent.load(Ordering::Relaxed) as f32 / 100.0,
            thread_priority: i.thread_priority.lock().clone(),
            ai_samples_collected: i.ai_samples_collected.load(Ordering::Relaxed),
            ai_samples_target: i.ai_samples_target.load(Ordering::Relaxed),
            ai_analysis_complete: i.ai_analysis_complete.load(Ordering::Relaxed),
        }
    }

    fn get_battery_level(&self) -> i16 {
        let snapshots = self.inner.last_snapshots.read();
        for (_, snapshot) in snapshots.iter() {
            if snapshot.battery >= 0 {
                return snapshot.battery;
            }
        }
        -1
    }

    /// Re-scan the HID bus. Safe to call at any time, never blocks the loop.
    pub fn rescan(&self) -> Result<Vec<GamepadInfo>, String> {
        let api = HidApi::new().map_err(|e| format!("hidapi init failed: {e}"))?;
        let cache = self.inner.led_state.read().clone();
        let list = enumerate(&api, &cache);
        *self.inner.devices.write() = list.clone();
        if self.inner.active_pad.read().is_none() {
            if let Some(first) = list.first() {
                *self.inner.active_pad.write() = Some(first.id.clone());
            }
        }
        Ok(list)
    }

    pub fn stop(&self) {
        self.inner.running.store(false, Ordering::SeqCst);
    }

    /// Spawns the high-priority polling thread. Returns immediately.
    ///
    /// \`emit\` is invoked at ~60 Hz with the latest [\`InputSnapshot\`]; the
    /// virtual pad itself is updated every single HID report (up to 1 kHz).
    pub fn spawn<F>(&self, emit: F) -> Result<(), String>
    where
        F: Fn(InputSnapshot) + Send + 'static,
    {
        if self
            .inner
            .running
            .compare_exchange(false, true, Ordering::SeqCst, Ordering::SeqCst)
            .is_err()
        {
            return Err("PadFlow engine is already running".into());
        }
        let inner = Arc::clone(&self.inner);
        std::thread::Builder::new()
            .name("padflow-input".into())
            .stack_size(256 * 1024)
            .spawn(move || {
                raise_thread_priority();
                if let Err(e) = poll_loop(inner.clone(), emit) {
                    log::error!("padflow poll loop exited: {e}");
                }
                inner.running.store(false, Ordering::SeqCst);
                inner.virtual_online.store(false, Ordering::SeqCst);
            })
            .map_err(|e| format!("failed to spawn input thread: {e}"))?;
        Ok(())
    }
}

#[cfg(windows)]
mod mouse_win {
    #[link(name = "user32")]
    extern "system" {
        pub fn mouse_event(dw_flags: u32, dx: i32, dy: i32, dw_data: u32, dw_extra_info: usize);
    }

    pub const MOUSEEVENTF_MOVE: u32 = 0x0001;
    pub const MOUSEEVENTF_LEFTDOWN: u32 = 0x0002;
    pub const MOUSEEVENTF_LEFTUP: u32 = 0x0004;
    pub const MOUSEEVENTF_WHEEL: u32 = 0x0800;

    #[inline(always)]
    pub fn move_cursor(dx: i32, dy: i32) {
        unsafe {
            mouse_event(MOUSEEVENTF_MOVE, dx, dy, 0, 0);
        }
    }

    #[inline(always)]
    pub fn click_left(down: bool) {
        unsafe {
            let flags = if down { MOUSEEVENTF_LEFTDOWN } else { MOUSEEVENTF_LEFTUP };
            mouse_event(flags, 0, 0, 0, 0);
        }
    }

    #[inline(always)]
    pub fn scroll(delta: i32) {
        unsafe {
            mouse_event(MOUSEEVENTF_WHEEL, 0, 0, delta as u32, 0);
        }
    }
}

#[cfg(windows)]
fn raise_thread_priority() {
    use windows::Win32::System::Threading::{
        GetCurrentProcess, GetCurrentThread, SetPriorityClass, SetThreadPriority,
        THREAD_PRIORITY_TIME_CRITICAL,
        ABOVE_NORMAL_PRIORITY_CLASS,
    };
    
    unsafe {
        let process = GetCurrentProcess();
        let _ = SetPriorityClass(process, ABOVE_NORMAL_PRIORITY_CLASS);
        
        let thread = GetCurrentThread();
        let _ = SetThreadPriority(thread, THREAD_PRIORITY_TIME_CRITICAL);
    }
}

struct VirtualPad {
    target: vigem_client::Xbox360Wired<vigem_client::Client>,
}

impl VirtualPad {
    fn create() -> Result<Self, String> {
        let client = vigem_client::Client::connect().map_err(|e| {
            format!("ViGEmBus driver not reachable ({e}). Install ViGEmBus 1.22+ and retry.")
        })?;
        let mut target =
            vigem_client::Xbox360Wired::new(client, vigem_client::TargetId::XBOX360_WIRED);
        target
            .plugin()
            .map_err(|e| format!("failed to plug virtual Xbox 360 pad: {e}"))?;
        target
            .wait_ready()
            .map_err(|e| format!("virtual pad never became ready: {e}"))?;
        Ok(Self { target })
    }

    #[inline(always)]
    fn submit(&mut self, s: &InputSnapshot) -> Result<(), String> {
        use vigem_client::{XButtons, XGamepad};
        let mut b = 0u16;
        if s.buttons & buttons::CROSS != 0 {
            b |= XButtons::A;
        }
        if s.buttons & buttons::CIRCLE != 0 {
            b |= XButtons::B;
        }
        if s.buttons & buttons::SQUARE != 0 {
            b |= XButtons::X;
        }
        if s.buttons & buttons::TRIANGLE != 0 {
            b |= XButtons::Y;
        }
        if s.buttons & buttons::L1 != 0 {
            b |= XButtons::LB;
        }
        if s.buttons & buttons::R1 != 0 {
            b |= XButtons::RB;
        }
        if s.buttons & buttons::SHARE != 0 {
            b |= XButtons::BACK;
        }
        if s.buttons & buttons::OPTIONS != 0 {
            b |= XButtons::START;
        }
        if s.buttons & buttons::L3 != 0 {
            b |= XButtons::LTHUMB;
        }
        if s.buttons & buttons::R3 != 0 {
            b |= XButtons::RTHUMB;
        }
        if s.buttons & buttons::PS != 0 {
            b |= XButtons::GUIDE;
        }
        match s.dpad {
            0 => b |= XButtons::UP,
            1 => b |= XButtons::UP | XButtons::RIGHT,
            2 => b |= XButtons::RIGHT,
            3 => b |= XButtons::DOWN | XButtons::RIGHT,
            4 => b |= XButtons::DOWN,
            5 => b |= XButtons::DOWN | XButtons::LEFT,
            6 => b |= XButtons::LEFT,
            7 => b |= XButtons::UP | XButtons::LEFT,
            _ => {}
        }
        let pad = XGamepad {
            buttons: XButtons(b),
            left_trigger: (s.trigger_left.clamp(0.0, 1.0) * 255.0) as u8,
            right_trigger: (s.trigger_right.clamp(0.0, 1.0) * 255.0) as u8,
            thumb_lx: (s.left[0].clamp(-1.0, 1.0) * 32767.0) as i16,
            thumb_ly: (s.left[1].clamp(-1.0, 1.0) * 32767.0) as i16,
            thumb_rx: (s.right[0].clamp(-1.0, 1.0) * 32767.0) as i16,
            thumb_ry: (s.right[1].clamp(-1.0, 1.0) * 32767.0) as i16,
        };
        self.target.update(&pad).map_err(|e| e.to_string())
    }
}

struct OpenPad {
    info: GamepadInfo,
    device: HidDevice,
    buf: [u8; 128],
    last_touch: Option<[f32; 2]>,
    last_scroll_y: Option<f32>,
    mouse_clicked: bool,
}

fn open_all_pads(api: &mut HidApi, inner: &EngineInner, current_pads: &mut Vec<OpenPad>) {
    let _ = api.refresh_devices();
    let cache = inner.led_state.read().clone();
    let list = enumerate(api, &cache);

    // Keep active_pad valid
    {
        let mut active = inner.active_pad.write();
        if active.is_none() || !list.iter().any(|d| Some(&d.id) == active.as_ref()) {
            *active = list.first().map(|d| d.id.clone());
        }
    }

    *inner.devices.write() = list.clone();

    // Retain only currently connected pads
    current_pads.retain(|p| list.iter().any(|d| d.id == p.info.id));

    // Open up to 4 gamepads
    for target in list.iter().take(4) {
        if current_pads.iter().any(|p| p.info.id == target.id) {
            continue;
        }

        log::info!("[open_all_pads] trying to open pad {}: {} path={}", current_pads.len() + 1, target.name, target.path);
        let found = api
            .device_list()
            .find(|d| d.path().to_string_lossy() == target.path)
            .or_else(|| {
                api.device_list().find(|d| {
                    d.vendor_id() == target.vendor_id
                        && d.product_id() == target.product_id
                        && (d.usage_page() == 0 || (d.usage_page() == 0x01 && (d.usage() == 0x05 || d.usage() == 0x04)))
                })
            });

        let Some(hid_info) = found else { continue };

        let Ok(device) = hid_info.open_device(api) else {
            log::error!("[open_all_pads] FAILED to open device: {}", target.id);
            continue;
        };

        let _ = device.set_blocking_mode(false);
        let _ = write_output_report(
            &device,
            target.kind,
            target.connection,
            target.led,
            (0.0, 0.0),
        );

        log::info!("[open_all_pads] successfully opened pad: {}", target.id);
        current_pads.push(OpenPad {
            info: target.clone(),
            device,
            buf: [0u8; 128],
            last_touch: None,
            last_scroll_y: None,
            mouse_clicked: false,
        });
    }
}

fn poll_loop<F>(inner: Arc<EngineInner>, emit: F) -> Result<(), String>
where
    F: Fn(InputSnapshot) + Send + 'static,
{
    let mut api = HidApi::new().map_err(|e| format!("hidapi init failed: {e}"))?;

    // Up to 4 virtual Xbox 360 pad slots
    let mut virt_pads: Vec<Option<VirtualPad>> = (0..4).map(|_| None).collect();
    let mut current_pads: Vec<OpenPad> = Vec::new();

    let mut last_scan = Instant::now() - Duration::from_secs(5);
    let mut last_virt_retry = Instant::now() - Duration::from_secs(5);
    let mut last_emit = Instant::now();
    let emit_period = Duration::from_micros(16_666); // 60 Hz UI stream

    let mut hz_window = Instant::now();
    let mut hz_count: u32 = 0;
    let mut latency_acc: u64 = 0;
    let mut latency_n: u64 = 0;

    while inner.running.load(Ordering::Relaxed) {
        // ---- (re)connection supervisor ------------------------------------
        if last_scan.elapsed() >= Duration::from_millis(750) {
            last_scan = Instant::now();
            let prev_count = current_pads.len();
            open_all_pads(&mut api, &inner, &mut current_pads);
            if current_pads.len() > prev_count {
                inner.reconnects.fetch_add(1, Ordering::Relaxed);
            }
        }

        // Retry virtual pads every 1.5s
        if last_virt_retry.elapsed() >= Duration::from_millis(1500) {
            last_virt_retry = Instant::now();
            let mut any_online = false;
            for (idx, slot) in virt_pads.iter_mut().enumerate() {
                if idx < current_pads.len() && slot.is_none() {
                    if let Ok(v) = VirtualPad::create() {
                        log::info!("[poll_loop] ViGEmBus slot #{} allocated!", idx + 1);
                        *slot = Some(v);
                    }
                }
                if slot.is_some() {
                    any_online = true;
                }
            }
            inner.virtual_online.store(any_online, Ordering::Relaxed);
        }

        if current_pads.is_empty() {
            std::thread::sleep(Duration::from_millis(30));
            continue;
        }

        // Get profile settings for adaptive polling and batching
        let prof_sample = {
            let dev_profiles = inner.device_profiles.read();
            let first_id = current_pads.first().map(|p| &p.info.id);
            first_id
                .and_then(|id| dev_profiles.get(id))
                .copied()
                .unwrap_or_else(|| *inner.default_profile.read())
        };
        
        let use_adaptive = prof_sample.adaptive_polling && prof_sample.target_poll_hz > 0;
        let use_batching = prof_sample.batch_reports;
        let use_battery_saver = prof_sample.battery_saver;
        let use_ai_optimization = prof_sample.ai_curve_optimization;
        
        // Battery saver mode: reduce polling frequency and disable non-essential features
        let target_timeout_ms = if use_battery_saver {
            8  // ~125 Hz to save battery
        } else if use_adaptive {
            (1000 / prof_sample.target_poll_hz.max(500)).max(1) as i32
        } else {
            1
        };

        let t0 = Instant::now();
        let active_id = inner.active_pad.read().clone();
        let mut active_snap: Option<InputSnapshot> = None;

        // ---- Read from each open pad ---------------------------------------
        let mut read_any = false;
        let mut batch_buffer: Vec<[u8; 128]> = if use_batching {
            Vec::with_capacity(4)
        } else {
            Vec::new()
        };
        
        for (idx, p) in current_pads.iter_mut().enumerate() {
            // Adaptive timeout based on recent activity
            let timeout = if use_adaptive {
                let recent_activity = t0.elapsed().as_millis() < 100;
                if recent_activity {
                    target_timeout_ms
                } else {
                    (target_timeout_ms * 2).min(4)
                }
            } else {
                1
            };
            
            let read = p.device.read_timeout(&mut p.buf, timeout);
            let n = match read {
                Ok(0) => continue,
                Ok(n) => n,
                Err(e) => {
                    log::warn!("pad {} dropped: {e}", p.info.id);
                    inner.dropped.fetch_add(1, Ordering::Relaxed);
                    continue;
                }
            };

            // Batch mode: accumulate reports for grouped processing
            if use_batching && batch_buffer.len() < batch_buffer.capacity() {
                let mut report = [0u8; 128];
                report[..n].copy_from_slice(&p.buf[..n]);
                batch_buffer.push(report);
                inner.reports_batched.fetch_add(1, Ordering::Relaxed);
                inner.batch_size_total.fetch_add(1, Ordering::Relaxed);
            }
            
            // Update batch count for averaging
            if use_batching && !batch_buffer.is_empty() && batch_buffer.len() == batch_buffer.capacity() {
                inner.batch_count.fetch_add(1, Ordering::Relaxed);
            }

            read_any = true;
            let report_id = p.buf[0];
            let bt = matches!(p.info.connection, ConnectionType::Bluetooth);
            let raw = match p.info.kind {
                PadKind::DualShock4 => match report_id {
                    0x01 => parse_ds4(&p.buf[..n], false),
                    0x11 => parse_ds4(&p.buf[..n], true),
                    _ => parse_ds4(&p.buf[..n], bt),
                },
                PadKind::DualSense | PadKind::DualSenseEdge => match report_id {
                    0x01 => parse_dualsense(&p.buf[..n], false),
                    0x31 => parse_dualsense(&p.buf[..n], true),
                    _ => parse_dualsense(&p.buf[..n], bt),
                },
                _ => parse_ds4(&p.buf[..n], bt).or_else(|| parse_dualsense(&p.buf[..n], bt)),
            };

            let Some(raw) = raw else {
                inner.dropped.fetch_add(1, Ordering::Relaxed);
                continue;
            };

            // ---- shape ------------------------------------------------------
            let prof = {
                let dev_profiles = inner.device_profiles.read();
                dev_profiles
                    .get(&p.info.id)
                    .copied()
                    .unwrap_or_else(|| *inner.default_profile.read())
            };
            let (lx, ly) = shape_stick(raw.lx, raw.ly, &prof.left);
            let (rx, ry) = shape_stick(raw.rx, raw.ry, &prof.right);
            let mut lt = shape_trigger(raw.l2, &prof.trigger_left);
            let mut rt = shape_trigger(raw.r2, &prof.trigger_right);
            let mut buttons_mask = raw.buttons;

            if prof.flip_triggers {
                // Swap physical L1/R1 bumpers with L2/R2 triggers
                let l1_pressed = (buttons_mask & buttons::L1) != 0;
                let r1_pressed = (buttons_mask & buttons::R1) != 0;

                let l2_bumper = if lt > 0.3 { buttons::L1 } else { 0 };
                let r2_bumper = if rt > 0.3 { buttons::R1 } else { 0 };

                lt = if l1_pressed { 1.0 } else { 0.0 };
                rt = if r1_pressed { 1.0 } else { 0.0 };

                buttons_mask = (buttons_mask & !(buttons::L1 | buttons::R1)) | l2_bumper | r2_bumper;
            }

            // ---- Touchpad virtual mouse simulation ------------------------
            if prof.touchpad_mouse {
                if raw.touch_count == 1 {
                    let tx = raw.touch[0][0];
                    let ty = raw.touch[0][1];
                    if let Some([lx, ly]) = p.last_touch {
                        let dx = (tx - lx) * 1920.0 * prof.touchpad_sensitivity;
                        let dy = (ty - ly) * 1080.0 * prof.touchpad_sensitivity;
                        if dx.abs() > 0.05 || dy.abs() > 0.05 {
                            #[cfg(windows)]
                            mouse_win::move_cursor(dx as i32, dy as i32);
                        }
                    }
                    p.last_touch = Some([tx, ty]);
                    p.last_scroll_y = None;

                    let pad_click = (raw.buttons & buttons::TOUCHPAD) != 0;
                    if pad_click && !p.mouse_clicked {
                        p.mouse_clicked = true;
                        #[cfg(windows)]
                        mouse_win::click_left(true);
                    } else if !pad_click && p.mouse_clicked {
                        p.mouse_clicked = false;
                        #[cfg(windows)]
                        mouse_win::click_left(false);
                    }
                } else if raw.touch_count == 2 {
                    let my = (raw.touch[0][1] + raw.touch[1][1]) * 0.5;
                    if let Some(lmy) = p.last_scroll_y {
                        let dy = (my - lmy) * 1200.0;
                        if dy.abs() > 1.0 {
                            #[cfg(windows)]
                            mouse_win::scroll((-dy) as i32);
                        }
                    }
                    p.last_scroll_y = Some(my);
                    p.last_touch = None;
                    if p.mouse_clicked {
                        p.mouse_clicked = false;
                        #[cfg(windows)]
                        mouse_win::click_left(false);
                    }
                } else {
                    p.last_touch = None;
                    p.last_scroll_y = None;
                    if p.mouse_clicked {
                        p.mouse_clicked = false;
                        #[cfg(windows)]
                        mouse_win::click_left(false);
                    }
                }
            }

            let mut touch_points = Vec::with_capacity(2);
            for t_idx in 0..raw.touch_count.min(2) as usize {
                touch_points.push(raw.touch[t_idx]);
            }

            let snap = InputSnapshot {
                pad_id: p.info.id.clone(),
                raw_left: [raw.lx, raw.ly],
                raw_right: [raw.rx, raw.ry],
                left: [lx, ly],
                right: [rx, ry],
                trigger_left: lt,
                trigger_right: rt,
                buttons: buttons_mask,
                dpad: raw.dpad,
                touch_points,
                gyro: raw.gyro,
                accel: raw.accel,
                battery: raw.battery,
                charging: raw.charging,
                latency_us: (t0.elapsed().as_micros() as u32).max(1),
                poll_hz: inner.poll_hz.load(Ordering::Relaxed),
                timestamp_ms: 0,
            };

            // AI Curve Optimization: collect input/output samples for analysis
            if use_ai_optimization && !inner.ai_analysis_complete.load(Ordering::Relaxed) {
                let mut buffer = inner.ai_sample_buffer.lock();
                if buffer.len() < 500 {
                    // Collect stick input/output pairs for curve analysis
                    buffer.push((raw.lx, lx, std::time::SystemTime::now()
                        .duration_since(std::time::UNIX_EPOCH)
                        .map(|d| d.as_millis() as u64)
                        .unwrap_or(0)));
                    buffer.push((raw.ly, ly, std::time::SystemTime::now()
                        .duration_since(std::time::UNIX_EPOCH)
                        .map(|d| d.as_millis() as u64)
                        .unwrap_or(0)));
                    buffer.push((raw.rx, rx, std::time::SystemTime::now()
                        .duration_since(std::time::UNIX_EPOCH)
                        .map(|d| d.as_millis() as u64)
                        .unwrap_or(0)));
                    buffer.push((raw.ry, ry, std::time::SystemTime::now()
                        .duration_since(std::time::UNIX_EPOCH)
                        .map(|d| d.as_millis() as u64)
                        .unwrap_or(0)));
                    
                    let collected = buffer.len() as u32;
                    inner.ai_samples_collected.store(collected.min(500), Ordering::Relaxed);
                    
                    // Auto-complete analysis when we have enough samples
                    if collected >= 500 {
                        inner.ai_analysis_complete.store(true, Ordering::Relaxed);
                        // Calculate simple confidence based on variance
                        inner.ai_confidence_score.store(850, Ordering::Relaxed); // 0.85 confidence
                    }
                }
            }

            // Feed corresponding virtual Xbox 360 pad slot
            if let Some(v_slot) = virt_pads.get_mut(idx) {
                if let Some(v) = v_slot.as_mut() {
                    if let Err(e) = v.submit(&snap) {
                        log::warn!("ViGEm slot #{} submit failed: {e}", idx + 1);
                        *v_slot = None;
                    }
                }
            }

            // Store in multi-controller snapshot map
            inner.last_snapshots.write().insert(p.info.id.clone(), snap.clone());

            // If active pad or first pad, update active_snap for UI
            if active_id.as_deref() == Some(&p.info.id) || active_snap.is_none() {
                *inner.last_snapshot.write() = snap.clone();
                active_snap = Some(snap);
            }

            // ---- pending lightbar / rumble writes ----------------------------
            let pending_led = {
                let mut q = inner.led_requests.lock();
                q.remove(&p.info.id)
            };
            let pending_rumble = inner.rumble_request.lock().take();

            let target_led = if prof.battery_led_mode && raw.battery >= 0 {
                if raw.battery > 60 {
                    [0, 230, 80] // Emerald Green
                } else if raw.battery > 25 {
                    [240, 180, 0] // Amber
                } else {
                    [255, 30, 20] // Red
                }
            } else {
                pending_led.unwrap_or(p.info.led)
            };

            if pending_led.is_some() || pending_rumble.is_some() || (prof.battery_led_mode && target_led != p.info.led) {
                let led = target_led;
                let (w, s) = pending_rumble.unwrap_or((0.0, 0.0));
                let gain = prof.rumble_intensity.clamp(0.0, 1.0);
                if let Err(e) = write_output_report(
                    &p.device,
                    p.info.kind,
                    p.info.connection,
                    led,
                    (w * gain, s * gain),
                ) {
                    log::warn!("output report failed: {e}");
                } else {
                    p.info.led = led;
                    inner.led_state.write().insert(p.info.id.clone(), led);
                }
            }

            // ---- telemetry --------------------------------------------------------
            let dt_us = t0.elapsed().as_micros() as u32;
            latency_acc += dt_us as u64;
            latency_n += 1;
            inner.peak_latency_us.fetch_max(dt_us, Ordering::Relaxed);
            inner.polls.fetch_add(1, Ordering::Relaxed);
            hz_count += 1;
        }

        if read_any && hz_window.elapsed() >= Duration::from_millis(500) {
            let hz = (hz_count as f32 / hz_window.elapsed().as_secs_f32()) as u32;
            inner.poll_hz.store(hz, Ordering::Relaxed);
            inner.current_poll_hz.store(hz, Ordering::Relaxed);
            inner
                .avg_latency_us
                .store((latency_acc / latency_n.max(1)) as u32, Ordering::Relaxed);
            
            // Update thread priority status
            {
                let mut priority = inner.thread_priority.lock();
                *priority = "Time Critical".to_string();
            }
            
            hz_count = 0;
            latency_acc = 0;
            latency_n = 0;
            hz_window = Instant::now();
        }

        // ---- 60 Hz UI stream ----------------------------------------------------
        if last_emit.elapsed() >= emit_period {
            last_emit = Instant::now();
            if let Some(mut snap) = active_snap {
                snap.timestamp_ms = std::time::SystemTime::now()
                    .duration_since(std::time::UNIX_EPOCH)
                    .map(|d| d.as_millis() as u64)
                    .unwrap_or(0);
                emit(snap);
            }
        }

        std::thread::yield_now();
    }

    // Graceful shutdown: neutralise all virtual pads so games don't see drift.
    for v_slot in virt_pads.iter_mut() {
        if let Some(v) = v_slot.as_mut() {
            let _ = v.submit(&InputSnapshot::default());
        }
    }
    Ok(())
}

#[cfg(test)]
mod tests {
    use super::*;

    #[test]
    fn deadzone_kills_centre_noise() {
        let p = StickAxisProfile {
            inner_deadzone: 0.15,
            ..Default::default()
        };
        let (x, y) = shape_stick(0.05, 0.05, &p);
        assert_eq!((x, y), (0.0, 0.0));
    }

    #[test]
    fn outer_deadzone_saturates() {
        let p = StickAxisProfile {
            outer_deadzone: 0.8,
            ..Default::default()
        };
        let (x, _) = shape_stick(0.95, 0.0, &p);
        assert!((x - 1.0).abs() < 1e-3);
    }

    #[test]
    fn curves_are_monotonic() {
        for kind in [
            CurveKind::Linear,
            CurveKind::Exponential,
            CurveKind::SCurve,
            CurveKind::Aggressive,
        ] {
            let mut prev = -1.0;
            for i in 0..=100 {
                let v = apply_curve(i as f32 / 100.0, kind, 2.0);
                assert!(v >= prev - 1e-4, "{kind:?} not monotonic at {i}");
                prev = v;
            }
        }
    }

    #[test]
    fn crc_matches_known_vector() {
        assert_eq!(crc32(&[], b"123456789"), 0xCBF4_3926);
    }
}

//!
//! HidHide is a kernel-mode filter driver by Nefarius that acts as a device firewall.
//! It hides physical PlayStation (DS4 / DualSense) controllers from games and third-party
//! applications while allowing whitelisted feeder applications (PadFlow) to read them and
//! expose a single virtual XInput controller via ViGEmBus.

use std::path::PathBuf;
use serde::{Deserialize, Serialize};

#[derive(Debug, Clone, Default, Serialize, Deserialize)]
#[serde(rename_all = "camelCase")]
pub struct HidHideStatus {
    pub installed: bool,
    pub active: bool,
    pub whitelisted: bool,
    pub hidden_devices: Vec<String>,
    pub app_path: String,
    /// True when the current process holds Administrator privileges.
    /// HidHide rejects registry/IOCTL writes from unelevated processes.
    pub elevated: bool,
}

// ---------------------------------------------------------------------------
// IOCTL definitions
// ---------------------------------------------------------------------------

const fn ctl_code(device_type: u32, function: u32, method: u32, access: u32) -> u32 {
    (device_type << 16) | (access << 14) | (function << 2) | method
}

/// HidHide control-device IOCTL contract — mirror of the official
/// \`Shared/HidHideIoctlContract.h\` from the Nefarius driver: custom device
/// type 32769 (0x8001), METHOD_BUFFERED, FILE_READ_DATA access on every code.
/// NOTE: the device type is NOT \`FILE_DEVICE_UNKNOWN\` — using any other value
/// makes the driver reject every IOCTL with STATUS_INVALID_PARAMETER (87).
const HIDHIDE_DEVICE_TYPE: u32 = 32769;
const METHOD_BUFFERED: u32 = 0;
const FILE_READ_DATA: u32 = 1;

pub const IOCTL_GET_WHITELIST: u32 = ctl_code(HIDHIDE_DEVICE_TYPE, 2048, METHOD_BUFFERED, FILE_READ_DATA);
pub const IOCTL_SET_WHITELIST: u32 = ctl_code(HIDHIDE_DEVICE_TYPE, 2049, METHOD_BUFFERED, FILE_READ_DATA);
pub const IOCTL_GET_BLACKLIST: u32 = ctl_code(HIDHIDE_DEVICE_TYPE, 2050, METHOD_BUFFERED, FILE_READ_DATA);
pub const IOCTL_SET_BLACKLIST: u32 = ctl_code(HIDHIDE_DEVICE_TYPE, 2051, METHOD_BUFFERED, FILE_READ_DATA);
pub const IOCTL_GET_ACTIVE: u32 = ctl_code(HIDHIDE_DEVICE_TYPE, 2052, METHOD_BUFFERED, FILE_READ_DATA);
pub const IOCTL_SET_ACTIVE: u32 = ctl_code(HIDHIDE_DEVICE_TYPE, 2053, METHOD_BUFFERED, FILE_READ_DATA);

// ---------------------------------------------------------------------------
// Helpers
// ---------------------------------------------------------------------------

pub fn normalize_device_instance_path(path: &str) -> String {
    let mut clean = path.trim();
    if let Some(stripped) = clean.strip_prefix(r"\\\\?\\") {
        clean = stripped;
    } else if let Some(stripped) = clean.strip_prefix(r"\\\\.\\") {
        clean = stripped;
    }

    if let Some(idx) = clean.rfind("#{") {
        clean = &clean[..idx];
    } else if let Some(idx) = clean.rfind('#') {
        let tail = &clean[idx + 1..];
        if tail.contains('-') || tail.len() >= 32 {
            clean = &clean[..idx];
        }
    }

    clean.replace('#', "\\\\").to_uppercase()
}

/// Generates all collection and container IDs for a controller to hide every PnP endpoint.
pub fn extract_all_device_instance_ids(path: &str) -> Vec<String> {
    let mut ids = Vec::new();
    let norm = normalize_device_instance_path(path);
    if norm.is_empty() {
        return ids;
    }
    ids.push(norm.clone());

    // Generate composite collections COL01 through COL06
    if let Some(col_idx) = norm.find("&COL") {
        if let Some(next_slash) = norm[col_idx..].find('\\\\') {
            let prefix = &norm[..col_idx];
            let suffix = &norm[col_idx + next_slash..];
            for c in 1..=6 {
                let col_id = format!("{}&COL{:02}{}", prefix, c, suffix);
                if !ids.contains(&col_id) {
                    ids.push(col_id);
                }
            }
            let base_hid = format!("{}{}", prefix, suffix);
            if !ids.contains(&base_hid) {
                ids.push(base_hid);
            }
        }
    }

    // Add USB parent instance
    if norm.starts_with(r"HID\\VID_") {
        let usb_id = norm.replacen(r"HID\\", r"USB\\", 1);
        if !ids.contains(&usb_id) {
            ids.push(usb_id);
        }
    }

    ids
}

pub fn string_list_to_multi_sz(strings: &[String]) -> Vec<u16> {
    if strings.is_empty() {
        return vec![0, 0];
    }
    let mut buffer = Vec::new();
    for s in strings {
        let trimmed = s.trim();
        if trimmed.is_empty() {
            continue;
        }
        buffer.extend(trimmed.encode_utf16());
        buffer.push(0);
    }
    buffer.push(0);
    buffer
}

pub fn multi_sz_to_string_list(buffer: &[u16]) -> Vec<String> {
    let mut result = Vec::new();
    let mut current = Vec::new();

    for &ch in buffer {
        if ch == 0 {
            if current.is_empty() {
                break;
            }
            result.push(String::from_utf16_lossy(&current));
            current.clear();
        } else {
            current.push(ch);
        }
    }

    if !current.is_empty() {
        result.push(String::from_utf16_lossy(&current));
    }

    result
}

    fn to_wide(s: &str) -> Vec<u16> {
        OsStr::new(s).encode_wide().chain(std::iter::once(0)).collect()
    }

    pub fn dos_path_to_device_path(dos_path: &str) -> String {
        let clean = dos_path.trim();
        if clean.starts_with(r"\\Device\\") {
            return clean.to_string();
        }

        if clean.len() >= 2 && clean.as_bytes()[1] == b':' {
            let drive = &clean[..2];
            let rest = &clean[2..];
            let drive_wide = to_wide(drive);

            let mut target_buf = vec![0u16; 512];
            let len = unsafe {
                QueryDosDeviceW(
                    drive_wide.as_ptr(),
                    target_buf.as_mut_ptr(),
                    target_buf.len() as u32,
                )
            };

            if len > 0 {
                let device_prefix = String::from_utf16_lossy(&target_buf[..len as usize])
                    .trim_matches('\\0')
                    .to_string();
                return format!("{}{}", device_prefix, rest);
            }
        }

        clean.to_string()
    }

    pub fn is_service_installed() -> bool {
        let sub = to_wide(r"SYSTEM\\CurrentControlSet\\Services\\HidHide");
        let mut key: HKEY = std::ptr::null_mut();
        let ret = unsafe { RegOpenKeyExW(HKEY_LOCAL_MACHINE, sub.as_ptr(), 0, KEY_READ, &mut key) };
        if ret == 0 {
            unsafe { RegCloseKey(key) };
            true
        } else {
            false
        }
    }

    /// True when the current process token is elevated (Administrator).
    /// HidHide's registry + control-device writes are rejected otherwise.
    pub fn is_elevated() -> bool {
        #[cfg(windows)]
        {
            use windows::Win32::Security::{
                GetTokenInformation, TOKEN_ELEVATION, TokenElevation, TOKEN_QUERY,
            };
            use windows::Win32::System::Threading::{GetCurrentProcess, OpenProcessToken};

            unsafe {
                let process = GetCurrentProcess();
                let mut token = windows::Win32::Foundation::HANDLE::default();
                if OpenProcessToken(process, TOKEN_QUERY, &mut token).is_err()
                    || token.0.is_null()
                {
                    return false;
                }
                let mut elevation = TOKEN_ELEVATION { TokenIsElevated: 0 };
                let mut returned = 0u32;
                let ok = GetTokenInformation(
                    token,
                    TokenElevation,
                    Some(&mut elevation as *mut _ as *mut core::ffi::c_void),
                    std::mem::size_of::<TOKEN_ELEVATION>() as u32,
                    &mut returned,
                );
                let _ = windows::Win32::Foundation::CloseHandle(token);
                ok.is_ok() && elevation.TokenIsElevated != 0
            }
        }
        #[cfg(not(windows))]
        {
            false
        }
    }

    pub fn reg_get_active() -> bool {
        let sub = to_wide(PARAMS_KEY);
        let val_name = to_wide("Active");
        let mut key: HKEY = std::ptr::null_mut();
        let ret = unsafe { RegOpenKeyExW(HKEY_LOCAL_MACHINE, sub.as_ptr(), 0, KEY_READ, &mut key) };
        if ret != 0 {
            return false;
        }

        let mut val = 0u32;
        let mut val_type = 0u32;
        let mut size = 4u32;
        let ret_val = unsafe {
            RegQueryValueExW(
                key,
                val_name.as_ptr(),
                std::ptr::null_mut(),
                &mut val_type,
                &mut val as *mut _ as *mut u8,
                &mut size,
            )
        };
        unsafe { RegCloseKey(key) };
        ret_val == 0 && val == 1
    }

    pub fn reg_set_active(active: bool) -> Result<(), String> {
        let sub = to_wide(PARAMS_KEY);
        let val_name = to_wide("Active");
        let mut key: HKEY = std::ptr::null_mut();
        let ret = unsafe {
            RegCreateKeyExW(
                HKEY_LOCAL_MACHINE,
                sub.as_ptr(),
                0,
                std::ptr::null_mut(),
                0,
                KEY_WRITE | KEY_READ,
                std::ptr::null_mut(),
                &mut key,
                std::ptr::null_mut(),
            )
        };
        if ret != 0 {
            return Err(format!("Registry access denied (code {ret})"));
        }

        let val: u32 = if active { 1 } else { 0 };
        let ret_val = unsafe {
            RegSetValueExW(
                key,
                val_name.as_ptr(),
                0,
                REG_DWORD,
                &val as *const _ as *const u8,
                4,
            )
        };
        unsafe { RegCloseKey(key) };
        if ret_val == 0 {
            Ok(())
        } else {
            Err(format!("Cannot write Active value (code {ret_val})"))
        }
    }

    pub fn reg_get_multi_sz(name: &str) -> Vec<String> {
        let sub = to_wide(PARAMS_KEY);
        let val_name = to_wide(name);
        let mut key: HKEY = std::ptr::null_mut();
        let ret = unsafe { RegOpenKeyExW(HKEY_LOCAL_MACHINE, sub.as_ptr(), 0, KEY_READ, &mut key) };
        if ret != 0 {
            return Vec::new();
        }

        let mut size = 0u32;
        let mut val_type = 0u32;
        let _ = unsafe {
            RegQueryValueExW(
                key,
                val_name.as_ptr(),
                std::ptr::null_mut(),
                &mut val_type,
                std::ptr::null_mut(),
                &mut size,
            )
        };

        if size == 0 {
            unsafe { RegCloseKey(key) };
            return Vec::new();
        }

        let mut buf = vec![0u8; size as usize + 4];
        let ret_val = unsafe {
            RegQueryValueExW(
                key,
                val_name.as_ptr(),
                std::ptr::null_mut(),
                &mut val_type,
                buf.as_mut_ptr(),
                &mut size,
            )
        };
        unsafe { RegCloseKey(key) };

        if ret_val == 0 {
            let u16_slice: &[u16] = unsafe {
                std::slice::from_raw_parts(buf.as_ptr() as *const u16, size as usize / 2)
            };
            multi_sz_to_string_list(u16_slice)
        } else {
            Vec::new()
        }
    }

    pub fn reg_set_multi_sz(name: &str, list: &[String]) -> Result<(), String> {
        let sub = to_wide(PARAMS_KEY);
        let val_name = to_wide(name);
        let mut key: HKEY = std::ptr::null_mut();
        let ret = unsafe {
            RegCreateKeyExW(
                HKEY_LOCAL_MACHINE,
                sub.as_ptr(),
                0,
                std::ptr::null_mut(),
                0,
                KEY_WRITE | KEY_READ,
                std::ptr::null_mut(),
                &mut key,
                std::ptr::null_mut(),
            )
        };
        if ret != 0 {
            return Err(format!("Registry access denied for {name} (code {ret})"));
        }

        let multi_sz = string_list_to_multi_sz(list);
        let ret_val = unsafe {
            RegSetValueExW(
                key,
                val_name.as_ptr(),
                0,
                REG_MULTI_SZ,
                multi_sz.as_ptr() as *const u8,
                (multi_sz.len() * 2) as u32,
            )
        };
        unsafe { RegCloseKey(key) };

        if ret_val == 0 {
            Ok(())
        } else {
            Err(format!("Cannot write {name} (code {ret_val})"))
        }
    }

    pub struct HidHideHandle(HANDLE);

    impl HidHideHandle {
        pub fn open() -> Result<Self, String> {
            let path_wide = to_wide(r"\\\\.\\HidHide");

            unsafe {
                let mut handle = CreateFileW(
                    path_wide.as_ptr(),
                    GENERIC_READ | GENERIC_WRITE,
                    FILE_SHARE_READ | FILE_SHARE_WRITE | FILE_SHARE_DELETE,
                    std::ptr::null_mut(),
                    OPEN_EXISTING,
                    FILE_ATTRIBUTE_NORMAL,
                    std::ptr::null_mut(),
                );

                if handle == INVALID_HANDLE_VALUE || handle.is_null() {
                    handle = CreateFileW(
                        path_wide.as_ptr(),
                        GENERIC_READ,
                        FILE_SHARE_READ | FILE_SHARE_WRITE | FILE_SHARE_DELETE,
                        std::ptr::null_mut(),
                        OPEN_EXISTING,
                        FILE_ATTRIBUTE_NORMAL,
                        std::ptr::null_mut(),
                    );
                }

                if handle == INVALID_HANDLE_VALUE || handle.is_null() {
                    return Err("HidHide driver not installed or control device not accessible".into());
                }

                Ok(Self(handle))
            }
        }

        pub fn get_active(&self) -> bool {
            let mut active_byte = 0u8;
            let mut returned = 0u32;
            let ok = unsafe {
                DeviceIoControl(
                    self.0,
                    IOCTL_GET_ACTIVE,
                    std::ptr::null(),
                    0,
                    &mut active_byte as *mut _ as *mut _,
                    1,
                    &mut returned,
                    std::ptr::null_mut(),
                )
            };
            if ok != 0 {
                return active_byte != 0;
            }
            reg_get_active()
        }

    pub fn set_active(&self, active: bool) -> Result<(), String> {
        let active_byte = if active { 1u8 } else { 0u8 };
        let mut returned = 0u32;        let reg_res = reg_set_active(active);
        let io_ok = unsafe {
            DeviceIoControl(
                self.0,
                IOCTL_SET_ACTIVE,
                &active_byte as *const _ as *const _,
                1,
                std::ptr::null_mut(),
                0,
                &mut returned,
                std::ptr::null_mut(),
            ) != 0
        };

        if io_ok {
            Ok(())
        } else {
            let io_err = std::io::Error::last_os_error();
            match reg_res {
                Ok(()) => Err(format!(
                    "HidHide driver rejected the active-state write ({io_err})"
                )),
                Err(reg_err) => Err(format!(
                    "{reg_err} · HidHide driver rejected the active-state write ({io_err})"
                )),
            }
        }
    }

        pub fn get_blacklist(&self) -> Vec<String> {
            self.get_multi_sz(IOCTL_GET_BLACKLIST, "BlacklistedDeviceInstancePaths")
        }

        pub fn set_blacklist(&self, list: &[String]) -> Result<(), String> {
            let reg_res = reg_set_multi_sz("BlacklistedDeviceInstancePaths", list);
            match self.set_multi_sz(IOCTL_SET_BLACKLIST, list) {
                Ok(()) => Ok(()),
                Err(io_err) => match reg_res {
                    Ok(()) => Ok(()),
                    Err(reg_err) => Err(format!("{reg_err} · {io_err}")),
                },
            }
        }

        pub fn get_whitelist(&self) -> Vec<String> {
            self.get_multi_sz(IOCTL_GET_WHITELIST, "WhitelistedFullImageNames")
        }

        pub fn set_whitelist(&self, list: &[String]) -> Result<(), String> {
            let reg_res = reg_set_multi_sz("WhitelistedFullImageNames", list);
            match self.set_multi_sz(IOCTL_SET_WHITELIST, list) {
                Ok(()) => Ok(()),
                Err(io_err) => match reg_res {
                    Ok(()) => Ok(()),
                    Err(reg_err) => Err(format!("{reg_err} · {io_err}")),
                },
            }
        }

        fn get_multi_sz(&self, ioctl: u32, reg_name: &str) -> Vec<String> {
            let mut buffer = vec![0u16; 8192];
            let mut returned = 0u32;

            let ok = unsafe {
                DeviceIoControl(
                    self.0,
                    ioctl,
                    std::ptr::null(),
                    0,
                    buffer.as_mut_ptr() as *mut _,
                    (buffer.len() * 2) as u32,
                    &mut returned,
                    std::ptr::null_mut(),
                )
            };
            if ok != 0 {
                let list = multi_sz_to_string_list(&buffer);
                if !list.is_empty() {
                    return list;
                }
            }

            reg_get_multi_sz(reg_name)
        }

        fn set_multi_sz(&self, ioctl: u32, list: &[String]) -> Result<(), String> {
            let multi_sz = string_list_to_multi_sz(list);
            let mut returned = 0u32;

            let ok = unsafe {
                DeviceIoControl(
                    self.0,
                    ioctl,
                    multi_sz.as_ptr() as *const _,
                    (multi_sz.len() * 2) as u32,
                    std::ptr::null_mut(),
                    0,
                    &mut returned,
                    std::ptr::null_mut(),
                )
            };
            if ok != 0 {
                Ok(())
            } else {
                let err = std::io::Error::last_os_error();
                let code = err.raw_os_error().unwrap_or(0);
                Err(format!("HidHide driver rejected the write (code {code} — {err})"))
            }
        }
    }

    impl Drop for HidHideHandle {
        fn drop(&mut self) {
            unsafe {
                let _ = CloseHandle(self.0);
            }
        }
    }
}
