pub fn is_installed() -> bool {
    #[cfg(windows)]
    {
        win::is_service_installed() || win::find_hidhide_gui().is_some() || win::HidHideHandle::open().is_ok()
    }
    #[cfg(not(windows))]
    {
        false
    }
}

pub fn get_status() -> HidHideStatus {
    let current_exe = std::env::current_exe()
        .map(|p| p.to_string_lossy().to_string())
        .unwrap_or_default();

    #[cfg(windows)]
    {
        if !is_installed() {
            return HidHideStatus {
                installed: false,
                active: false,
                whitelisted: false,
                hidden_devices: Vec::new(),
                app_path: current_exe,
                elevated: win::is_elevated(),
            };
        }

        let (active, hidden, whitelist) = if let Ok(handle) = win::HidHideHandle::open() {
            (handle.get_active(), handle.get_blacklist(), handle.get_whitelist())
        } else {
            (win::reg_get_active(), win::reg_get_multi_sz("BlacklistedDeviceInstancePaths"), win::reg_get_multi_sz("WhitelistedFullImageNames"))
        };

        let exe_lower = current_exe.to_lowercase();
        let dev_lower = win::dos_path_to_device_path(&current_exe).to_lowercase();

        let whitelisted = whitelist.iter().any(|w| {
            let w_lower = w.to_lowercase();
            w_lower == exe_lower
                || w_lower == dev_lower
                || exe_lower.ends_with(&w_lower)
                || w_lower.ends_with(&exe_lower)
        });

        HidHideStatus {
            installed: true,
            active,
            whitelisted,
            hidden_devices: hidden,
            app_path: current_exe,
            elevated: win::is_elevated(),
        }
    }

    #[cfg(not(windows))]
    {
        HidHideStatus {
            installed: false,
            active: false,
            whitelisted: false,
            hidden_devices: Vec::new(),
            app_path: current_exe,
            elevated: false,
        }
    }
}

pub fn auto_whitelist_current_process() -> Result<(), String> {
    #[cfg(windows)]
    {
        let current_exe = std::env::current_exe()
            .map_err(|e| format!("Failed to get current executable path: {e}"))?
            .to_string_lossy()
            .to_string();

        let device_path = win::dos_path_to_device_path(&current_exe);

        if let Ok(handle) = win::HidHideHandle::open() {
            let mut whitelist = handle.get_whitelist();
            let dev_lower = device_path.to_lowercase();
            let exe_lower = current_exe.to_lowercase();

            let mut changed = false;
            if !whitelist.iter().any(|w| w.to_lowercase() == dev_lower) {
                whitelist.push(device_path);
                changed = true;
            }
            if !whitelist.iter().any(|w| w.to_lowercase() == exe_lower) {
                whitelist.push(current_exe);
                changed = true;
            }

            if changed {
                handle.set_whitelist(&whitelist)?;
            }
        } else {
            let mut whitelist = win::reg_get_multi_sz("WhitelistedFullImageNames");
            let dev_lower = device_path.to_lowercase();
            let exe_lower = current_exe.to_lowercase();

            let mut changed = false;
            if !whitelist.iter().any(|w| w.to_lowercase() == dev_lower) {
                whitelist.push(device_path);
                changed = true;
            }
            if !whitelist.iter().any(|w| w.to_lowercase() == exe_lower) {
                whitelist.push(current_exe);
                changed = true;
            }

            if changed {
                win::reg_set_multi_sz("WhitelistedFullImageNames", &whitelist)?;
            }
        }

        Ok(())
    }
    #[cfg(not(windows))]
    {
        Ok(())
    }
}

pub fn hide_device(raw_path: &str) -> Result<(), String> {
    let ids = extract_all_device_instance_ids(raw_path);
    if ids.is_empty() {
        return Err("Invalid device path".into());
    }

    #[cfg(windows)]
    {
        let _ = auto_whitelist_current_process();

        if let Ok(handle) = win::HidHideHandle::open() {
            let mut list = handle.get_blacklist();
            let mut changed = false;
            for id in &ids {
                if !list.iter().any(|p| p.eq_ignore_ascii_case(id)) {
                    list.push(id.clone());
                    changed = true;
                }
            }
            if changed {
                handle.set_blacklist(&list)?;
            }
            handle.set_active(true)?;
        } else {
            let mut list = win::reg_get_multi_sz("BlacklistedDeviceInstancePaths");
            let mut changed = false;
            for id in &ids {
                if !list.iter().any(|p| p.eq_ignore_ascii_case(id)) {
                    list.push(id.clone());
                    changed = true;
                }
            }
            if changed {
                win::reg_set_multi_sz("BlacklistedDeviceInstancePaths", &list)?;
            }
            win::reg_set_active(true)?;
        }

        Ok(())
    }
    #[cfg(not(windows))]
    {
        let _ = raw_path;
        Ok(())
    }
}

pub fn unhide_device(raw_path: &str) -> Result<(), String> {
    let ids = extract_all_device_instance_ids(raw_path);

    #[cfg(windows)]
    {
        if let Ok(handle) = win::HidHideHandle::open() {
            let mut list = handle.get_blacklist();
            let initial_len = list.len();
            list.retain(|p| !ids.iter().any(|id| id.eq_ignore_ascii_case(p)) && !p.eq_ignore_ascii_case(raw_path));
            if list.len() != initial_len {
                handle.set_blacklist(&list)?;
            }
        } else {
            let mut list = win::reg_get_multi_sz("BlacklistedDeviceInstancePaths");
            let initial_len = list.len();
            list.retain(|p| !ids.iter().any(|id| id.eq_ignore_ascii_case(p)) && !p.eq_ignore_ascii_case(raw_path));
            if list.len() != initial_len {
                win::reg_set_multi_sz("BlacklistedDeviceInstancePaths", &list)?;
            }
        }

        Ok(())
    }
    #[cfg(not(windows))]
    {
        let _ = raw_path;
        Ok(())
    }
}

pub fn set_active(active: bool) -> Result<(), String> {
    #[cfg(windows)]
    {
        if let Ok(handle) = win::HidHideHandle::open() {
            handle.set_active(active)?;
        } else {
            win::reg_set_active(active)?;
        }

        Ok(())
    }
    #[cfg(not(windows))]
    {
        let _ = active;
        Ok(())
    }
}

pub fn uncloak_all_controllers() -> Result<HidHideStatus, String> {
    #[cfg(windows)]
    {
        // Short-circuit: when nothing is hidden and the shield is already off,
        // there is nothing to write — avoids a confusing access-denied error
        // for unelevated users with an empty blacklist.
        if let Ok(handle) = win::HidHideHandle::open() {
            if !handle.get_blacklist().is_empty() {
                handle.set_blacklist(&[])?;
            }
            if handle.get_active() {
                handle.set_active(false)?;
            }
        } else {
            if !win::reg_get_multi_sz("BlacklistedDeviceInstancePaths").is_empty() {
                win::reg_set_multi_sz("BlacklistedDeviceInstancePaths", &[])?;
            }
            if win::reg_get_active() {
                win::reg_set_active(false)?;
            }
        }
    }
    Ok(get_status())
}

/// Relaunches PadFlow with Administrator privileges (UAC prompt).
///
/// The elevated copy is launched by a detached watcher that FIRST waits for
/// this process to exit. That ordering is required: the tauri
/// single-instance plugin aborts a second instance while the first one still
/// holds its named mutex, so launching the elevated copy while we are still
/// alive would make it self-terminate. On UAC cancel the watcher falls back
/// to launching PadFlow normally so the user is never left with nothing.
pub fn relaunch_as_admin() -> Result<(), String> {
    #[cfg(windows)]
    {
        use std::os::windows::process::CommandExt;

        const CREATE_NO_WINDOW: u32 = 0x08000000;
        let exe = std::env::current_exe()
            .map_err(|e| format!("failed to resolve PadFlow path: {e}"))?;
        let pid = std::process::id();
        let exe_esc = exe.to_string_lossy().replace('\\'', "''");
        // Wait for THIS process to die, then elevate. Fallback to a normal
        // launch if the UAC prompt is cancelled.
        let script = format!(
            "$ErrorActionPreference='SilentlyContinue'; \\
             $p = Get-Process -Id {pid} -ErrorAction SilentlyContinue; \\
             if ($p) {{ $p.WaitForExit() }}; \\
             $e = Start-Process -FilePath '{exe_esc}' -Verb RunAs -PassThru; \\
             if (-not $e) {{ Start-Process -FilePath '{exe_esc}' }}"
        );
        let mut proc = std::process::Command::new("powershell");
        proc.creation_flags(CREATE_NO_WINDOW);
        proc.args(["-Command", &script])
            .spawn()

pub fn install_hidhide_driver(app: &tauri::AppHandle) -> Result<String, String> {
    use std::os::windows::process::CommandExt;
    use tauri::Manager;

    const CREATE_NO_WINDOW: u32 = 0x08000000;

    let candidate_names = [
        "HidHide_Setup.exe",
        "HidHide_1.5.230_x64.exe",
        "HidHideMSI.msi",
        "HidHide.exe",
    ];

    let mut found_installer: Option<PathBuf> = None;

    if let Ok(res_dir) = app.path().resource_dir() {
        for name in &candidate_names {
            let p1 = res_dir.join("resources").join(name);
            let p2 = res_dir.join(name);
            if p1.exists() {
                found_installer = Some(p1);
                break;
            }
            if p2.exists() {
                found_installer = Some(p2);
                break;
            }
        }
    }

    if found_installer.is_none() {
        if let Ok(exe_path) = std::env::current_exe() {
            if let Some(parent) = exe_path.parent() {
                for name in &candidate_names {
                    let p1 = parent.join("resources").join(name);
                    let p2 = parent.join(name);
                    let p3 = parent.join("src-tauri").join("resources").join(name);
                    if p1.exists() {
                        found_installer = Some(p1);
                        break;
                    }
                    if p2.exists() {
                        found_installer = Some(p2);
                        break;
                    }
                    if p3.exists() {
                        found_installer = Some(p3);
                        break;
                    }
                }
            }
        }
    }

    let target_path = if let Some(local_path) = found_installer {
        local_path
    } else {
        let temp_exe = std::env::temp_dir().join("HidHide_Setup.exe");
        let dl_cmd = format!(
            "[Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12; $ProgressPreference = 'SilentlyContinue'; (New-Object System.Net.WebClient).DownloadFile('https://github.com/nefarius/HidHide/releases/download/v1.5.230.0/HidHide_1.5.230_x64.exe', '{}')",
            temp_exe.to_string_lossy().replace('\\'', "''")
        );
        let mut dl = std::process::Command::new("powershell");
        #[cfg(windows)]
        dl.creation_flags(CREATE_NO_WINDOW);

        let dl_status = dl
            .args(["-Command", &dl_cmd])
            .status()
            .map_err(|e| format!("failed to download HidHide installer: {e}"))?;

        if !dl_status.success() || !temp_exe.exists() {
            let fallback_url = "https://github.com/nefarius/HidHide/releases/download/v1.5.212.0/HidHide_1.5.212_x64.exe";
            let dl_fallback = format!(
                "[Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12; $ProgressPreference = 'SilentlyContinue'; (New-Object System.Net.WebClient).DownloadFile('{}', '{}')",
                fallback_url,
                temp_exe.to_string_lossy().replace('\\'', "''")
            );
            let mut dl2 = std::process::Command::new("powershell");
            #[cfg(windows)]
            dl2.creation_flags(CREATE_NO_WINDOW);

            let fallback_status = dl2
                .args(["-Command", &dl_fallback])
                .status()
                .map_err(|e| format!("failed to download HidHide installer: {e}"))?;

            if !fallback_status.success() || !temp_exe.exists() {
                return Err("Failed to download HidHide installer from GitHub releases. Please check internet connection or place HidHide_Setup.exe in src-tauri/resources/".into());
            }
        }
        temp_exe
    };

    let is_msi = target_path
        .extension()
        .map(|e| e.to_string_lossy().to_lowercase() == "msi")
        .unwrap_or(false);

    let install_cmd = if is_msi {
        format!(
            "Start-Process -FilePath 'msiexec.exe' -ArgumentList '/i', '{}', '/norestart' -Verb RunAs -Wait",
            target_path.to_string_lossy().replace('\\'', "''")
        )
    } else {
        format!(
            "Start-Process -FilePath '{}' -ArgumentList '/norestart' -Verb RunAs -Wait",
            target_path.to_string_lossy().replace('\\'', "''")
        )
    };

    let mut install_proc = std::process::Command::new("powershell");
    #[cfg(windows)]
    install_proc.creation_flags(CREATE_NO_WINDOW);

    let status = install_proc
        .args(["-Command", &install_cmd])
        .status()
        .map_err(|e| format!("failed to run HidHide installer: {e}"))?;

    let mut start_svc = std::process::Command::new("powershell");
    #[cfg(windows)]
    start_svc.creation_flags(CREATE_NO_WINDOW);
    let _ = start_svc
        .args(["-Command", "Start-Service HidHide -ErrorAction SilentlyContinue; net start HidHide"])
        .status();

    if status.success() {
        if is_installed() {
            let _ = auto_whitelist_current_process();
            Ok("HidHide driver installed successfully! Anti-double-input protection active.".into())
        } else {
            Ok("HidHide installation completed. If shielding remains inactive, please restart Windows once to load filter driver.".into())
        }
    } else {
        Err("HidHide installation was cancelled or denied Administrator permissions".into())
    }
}

`,$g=`//! PadFlow — Tauri v2 IPC surface.
//!
//! Every command returns \`Result<T, String>\` so the TypeScript side can use a
//! single \`try/catch\` and surface a human readable toast. No command ever
//! blocks the input thread: they either read a \`RwLock\` snapshot or push a
//! request into a lock-free-ish queue drained by the poll loop.

use serde::{Deserialize, Serialize};
use tauri::{AppHandle, Emitter, Manager, State};

    apply_curve, shape_stick, CurveKind, EngineStats, GamepadInfo, InputSnapshot,
    StickAxisProfile, StickProfileConfig, TriggerProfile,
};

// Helper payloads
// ---------------------------------------------------------------------------

#[derive(Debug, Clone, Serialize, Deserialize)]
#[serde(rename_all = "camelCase")]
pub struct EngineStatus {
    pub stats: EngineStats,
    pub profile: StickProfileConfig,
    pub device_profiles: std::collections::HashMap<String, StickProfileConfig>,

#[derive(Debug, Clone, Serialize, Deserialize)]
#[serde(rename_all = "camelCase")]
pub struct CurvePreviewRequest {

    pub outer_deadzone: f32,

// Commands

/// Scans the HID bus and returns every connected PS4 / PS5 / XInput pad.

/// Sends the lightbar output report (USB or Bluetooth + CRC32) to a pad.
#[tauri::command]
pub fn set_led_color(
    pad_id: String,

    g: u8,
    b: u8,
    state: State<'_, AppState>,
    app: AppHandle,
) -> Result<(), String> {
    if pad_id.trim().is_empty() {
        return Err("pad_id must not be empty".into());
    }
    state.engine.queue_led(&pad_id, [r, g, b]);
    let _ = app.emit(
        "padflow-led-changed",
        serde_json::json!({ "padId": pad_id, "rgb": [r, g, b] }),
    );

/// Hot-swaps the stick shaping parameters. Applied on the very next HID report.
#[tauri::command]
pub fn update_stick_profile(
    profile_data: StickProfileConfig,
    pad_id: Option<String>,
    state: State<'_, AppState>,
    app: AppHandle,
) -> Result<StickProfileConfig, String> {
    validate_axis("left", &profile_data.left)?;
    validate_axis("right", &profile_data.right)?;
    validate_trigger("triggerLeft", &profile_data.trigger_left)?;
    validate_trigger("triggerRight", &profile_data.trigger_right)?;
    if !(0.0..=1.0).contains(&profile_data.rumble_intensity) {
        return Err("rumble_intensity must be within 0.0..=1.0".into());
    }
    if profile_data.touchpad_sensitivity < 0.1 || profile_data.touchpad_sensitivity > 5.0 {
        return Err("touchpad_sensitivity must be within 0.1..=5.0".into());
    }
    state.engine.set_profile_for(pad_id.as_deref(), profile_data);
    let _ = app.emit(
        "padflow-profile-updated",
        serde_json::json!({
            "padId": pad_id,
            "profile": profile_data,
        }),
    );
    Ok(profile_data)
}

fn validate_trigger(name: &str, t: &TriggerProfile) -> Result<(), String> {
    if t.inner_deadzone < 0.0 || t.inner_deadzone > 0.8 {
        return Err(format!("{name}.inner_deadzone must be within 0.0..=0.8"));
    }
    if t.outer_deadzone <= t.inner_deadzone || t.outer_deadzone > 1.0 {
        return Err(format!(
            "{name}.outer_deadzone must be greater than inner deadzone and <= 1.0"
        ));
    }
    Ok(())
}

fn validate_axis(name: &str, a: &StickAxisProfile) -> Result<(), String> {
    if a.inner_deadzone < 0.0 || a.inner_deadzone > 0.9 {
        return Err(format!("{name}.inner_deadzone must be within 0.0..=0.9"));
    }
    if a.outer_deadzone <= a.inner_deadzone || a.outer_deadzone > 1.0 {
        return Err(format!(
            "{name}.outer_deadzone must be greater than the inner deadzone and <= 1.0"
        ));
    }
    if a.anti_deadzone < 0.0 || a.anti_deadzone > 0.6 {
        return Err(format!("{name}.anti_deadzone must be within 0.0..=0.6"));
    }
    if a.curve_power < 0.5 || a.curve_power > 4.0 {
        return Err(format!("{name}.curve_power must be within 0.5..=4.0"));
    }
    if a.sensitivity < 0.25 || a.sensitivity > 3.0 {
        return Err(format!("{name}.sensitivity must be within 0.25..=3.0"));
    }
    Ok(())
}

/// Allocates the ViGEm virtual Xbox 360 target and starts the realtime loop.
/// Streams \`padflow-input-update\` to the webview at 60 Hz and heartbeat at 4 Hz.
pub fn run_engine_with_telemetry(
    engine: &crate::input::gamepad::PadFlowEngine,
    app: &AppHandle,
) -> Result<EngineStats, String> {
    if !engine.is_running() {
        let _ = engine.rescan();
        let sink = app.clone();
        engine.spawn(move |snapshot: InputSnapshot| {
            let _ = sink.emit("padflow-input-update", snapshot);
        })?;
    }

    // Telemetry heartbeat: 4 Hz, cheap, keeps the header widgets honest.
    let engine_clone = engine.clone();
    let beat = app.clone();
    tauri::async_runtime::spawn(async move {
        let mut tick = tokio::time::interval(std::time::Duration::from_millis(250));
        loop {
            tick.tick().await;
            let st = engine_clone.stats();
            let _ = beat.emit("padflow-engine-stats", st.clone());
            if !st.running {
                break;
            }
        }
    });

    let stats = engine.stats();
    let _ = app.emit("padflow-engine-started", stats.clone());
    let _ = app.emit("padflow-engine-stats", stats.clone());
    Ok(stats)
}

/// Allocates the ViGEm virtual Xbox 360 target and starts the realtime loop.

/// Cloaks all currently connected PlayStation controllers. Surfaces the REAL
/// failure cause instead of silently swallowing driver errors (v1.2.1).
#[tauri::command]
pub fn auto_cloak_controllers(state: State<'_, AppState>, app: AppHandle) -> Result<HidHideStatus, String> {
    let devices = state
        .engine
        .rescan()
        .map_err(|e| format!("Rescan failed: {e}"))?;
    let _ = hidhide::auto_whitelist_current_process();

    use crate::input::gamepad::PadKind;
    let ps_pads: Vec<_> = devices
        .iter()
        .filter(|d| {
            matches!(
                d.kind,
                PadKind::DualShock4 | PadKind::DualSense | PadKind::DualSenseEdge
            )
        })
        .collect();

    if ps_pads.is_empty() {
        let detail = if devices.is_empty() {
            "no controllers detected by PadFlow — is the pad connected over USB or Bluetooth?".into()
        } else {
            let names: Vec<&str> = devices.iter().map(|d| d.name.as_str()).collect();
            format!(
                "detected {} controller(s): {} — none is PlayStation. If your DualSense appears in joy.cpl but not here, reconnect it via USB.",
                devices.len(),
                names.join(", ")
            )
        };
        return Err(format!("Nothing to cloak — {detail}"));
    }

    let mut errors: Vec<String> = Vec::new();
    for dev in &ps_pads {
        if let Err(e) = hidhide::hide_device(&dev.path) {
            errors.push(format!("{} → {e}", dev.name));
        }
    }
    if !errors.is_empty() {
        let hint = "if it persists, try RESTART AS ADMIN (registry fallback)";
        return Err(format!("Cloak rejected by HidHide: {} · {hint}", errors.join(" | ")));
    }
    hidhide::set_active(true)?;
    let status = hidhide::get_status();
    let _ = app.emit("padflow-hidhide-updated", status.clone());
    Ok(status)
}

/// Server-side curve evaluation — guarantees the canvas draws *exactly* the
/// same maths the input thread executes (no drift between UI and engine).
#[tauri::command]
pub fn preview_curve(req: CurvePreviewRequest) -> Result<Vec<[f32; 2]>, String> {
    let n = req.samples.clamp(8, 512);
    let axis = StickAxisProfile {
        inner_deadzone: req.inner_deadzone,
        outer_deadzone: req.outer_deadzone,
        anti_deadzone: req.anti_deadzone,
        curve: req.curve,
        curve_power: req.power,
        sensitivity: 1.0,
        invert_y: false,
        radial: true,
    };
    let mut out = Vec::with_capacity(n as usize + 1);
    for i in 0..=n {
        let t = i as f32 / n as f32;
        let (x, _) = shape_stick(t, 0.0, &axis);
        out.push([t, x]);
    }
    // Touch \`apply_curve\` so the pure maths path is always linked in release.
    debug_assert!(apply_curve(0.5, req.curve, req.power) >= 0.0);
    Ok(out)
}

/// Launches the ViGEmBus driver installer with UAC Administrator privileges.
#[tauri::command]
pub fn install_vigem_driver(app: AppHandle) -> Result<String, String> {

        .path()

            temp_exe.to_string_lossy().replace("'", "''")
        );
        let dl_status = std::process::Command::new("powershell")
            .args(["-Command", &dl_cmd])
            .status()
            .map_err(|e| format!("failed to download driver installer: {e}"))?;
        if !dl_status.success() {
            return Err("Failed to download ViGEmBus driver installer from GitHub".into());
        }
    }

    let exe_to_run = if target_path.exists() { target_path } else { temp_exe };

    // Run installer with /norestart so the user sees the wizard and NO auto-reboot can happen
    let install_cmd = format!(
        "Start-Process -FilePath '{}' -ArgumentList '/norestart' -Verb RunAs -Wait",
        exe_to_run.to_string_lossy().replace("'", "''")
    );

    let status = std::process::Command::new("powershell")
        .args(["-Command", &install_cmd])
        .status()
        .map_err(|e| format!("failed to run installer: {e}"))?;

    // Attempt to start ViGEmBus service in case it's not automatically started by Windows
    let _ = std::process::Command::new("powershell")
        .args(["-Command", "Start-Service ViGEmBus -ErrorAction SilentlyContinue; net start ViGEmBus"])
        .status();

    if status.success() {
        // Verify if ViGEmBus client can connect
        if vigem_client::Client::connect().is_ok() {
            Ok("ViGEmBus driver installed and connected! Virtual pad online.".into())
        } else {
            Ok("ViGEmBus installation finished. If virtual pad remains offline, please restart Windows once to load driver.".into())
        }
    } else {
        Err("Driver installation was cancelled or denied Administrator permissions".into())
    }
}
`,eb=`//! PadFlow — Tauri v2 application shell.
//!
//! Responsibilities:
//! * own the [\`PadFlowEngine\`] singleton in Tauri managed state,
//! * build the tray icon (battery aware) + context menu,
//! * keep the process alive in the tray when the window is closed,
//! * auto-start the input engine as soon as the webview is ready.

pub mod commands;
pub mod game_detector;
pub mod hidhide;
pub mod input;

use tauri::{
    menu::{Menu, MenuItem, PredefinedMenuItem},
    tray::{MouseButton, MouseButtonState, TrayIconBuilder, TrayIconEvent},
    Emitter, Manager, WindowEvent,
};

use crate::input::gamepad::PadFlowEngine;
use crate::game_detector::GameDetector;

/// Everything the IPC layer needs. Cheap to clone (engine is \`Arc\` inside).
pub struct AppState {
    pub engine: PadFlowEngine,
    pub game_detector: GameDetector,
}

#[cfg_attr(mobile, tauri::mobile_entry_point)]
pub fn run() {
    env_logger::Builder::from_env(env_logger::Env::default().default_filter_or("info")).init();

    let engine = PadFlowEngine::new();
    let engine_for_tray = engine.clone();
    let game_detector = GameDetector::new();

    tauri::Builder::default()
        .plugin(tauri_plugin_shell::init())
        .plugin(tauri_plugin_store::Builder::new().build())
        .plugin(tauri_plugin_updater::Builder::new().build())
        .plugin(tauri_plugin_single_instance::init(|app, _argv, _cwd| {
            if let Some(w) = app.get_webview_window("main") {
                let _ = w.show();
                let _ = w.unminimize();
                let _ = w.set_focus();
            }
        }))
        .manage(AppState {
            engine: engine.clone(),
            game_detector: game_detector.clone(),
        })
        .invoke_handler(tauri::generate_handler![
            commands::get_connected_gamepads,
            commands::set_led_color,
            commands::update_stick_profile,
            commands::start_padflow_engine,
            commands::stop_padflow_engine,
            commands::get_engine_status,
            commands::get_last_snapshot,
            commands::select_gamepad,
            commands::test_rumble,
            commands::preview_curve,
            commands::toggle_window,
            commands::open_url,
            commands::install_vigem_driver,
            commands::get_hidhide_status,
            commands::set_hidhide_active,
            commands::toggle_device_hide,
            commands::auto_cloak_controllers,
            commands::uncloak_all_controllers,
            commands::launch_hidhide_gui,
            commands::install_hidhide_driver,
            commands::relaunch_app,
            commands::relaunch_as_admin,
            // Game detection commands
            commands::scan_for_games,
            commands::get_game_profiles,
            commands::add_game_profile,
            commands::remove_game_profile,
            commands::set_auto_switch_enabled,
            commands::is_auto_switch_enabled,
            commands::get_profile_for_game,
        ])
        .setup(move |app| {
            // ---- tray -----------------------------------------------------
            let show_i = MenuItem::with_id(app, "show", "Open PadFlow", true, None::<&str>)?;
            let engine_i = MenuItem::with_id(app, "engine", "Start / Stop engine", true, None::<&str>)?;
            let rescan_i = MenuItem::with_id(app, "rescan", "Rescan controllers", true, None::<&str>)?;
            let sep = PredefinedMenuItem::separator(app)?;
            let cloak_i = MenuItem::with_id(app, "cloak", "🛡️ Cloak all controllers (HidHide)", true, None::<&str>)?;
            let uncloak_i = MenuItem::with_id(app, "uncloak", "◉ Uncloak all controllers", true, None::<&str>)?;
            let sep2 = PredefinedMenuItem::separator(app)?;
            let quit_i = MenuItem::with_id(app, "quit", "Quit PadFlow", true, None::<&str>)?;
            let menu = Menu::with_items(
                app,
                &[&show_i, &engine_i, &rescan_i, &sep, &cloak_i, &uncloak_i, &sep2, &quit_i],
            )?;

            let tray_engine = engine_for_tray.clone();
            TrayIconBuilder::with_id("padflow-tray")
                .icon(app.default_window_icon().unwrap().clone())
                .tooltip("PadFlow — idle")
                .menu(&menu)
                .show_menu_on_left_click(false)
                .on_menu_event(move |app, event| match event.id.as_ref() {
                    "show" => {
                        if let Some(w) = app.get_webview_window("main") {
                            let _ = w.show();
                            let _ = w.unminimize();
                            let _ = w.set_focus();
                        }
                    }
                    "engine" => {
                        let state = app.state::<AppState>();
                        if state.engine.is_running() {
                            state.engine.stop();
                            let _ = hidhide::uncloak_all_controllers();
                            let stats = state.engine.stats();
                            let _ = app.emit("padflow-engine-stopped", stats.clone());
                            let _ = app.emit("padflow-engine-stats", stats);
                        } else {
                            let _ = commands::run_engine_with_telemetry(&state.engine, app);
                        }
                    }
                    "rescan" => {
                        let state = app.state::<AppState>();
                        if let Ok(list) = state.engine.rescan() {
                            let _ = app.emit("padflow-devices-changed", list);
                        }
                    }
                    "cloak" => {
                        let state = app.state::<AppState>();
                        let _ = commands::auto_cloak_controllers(state, app.clone());
                    }
                    "uncloak" => {
                        let _ = commands::uncloak_all_controllers(app.clone());
                    }
                    "quit" => {
                        tray_engine.stop();
                        let _ = hidhide::uncloak_all_controllers();
                        std::process::exit(0);
                    }
                    _ => {}
                })
                .on_tray_icon_event(|tray, event| {
                    if let TrayIconEvent::Click {
                        button: MouseButton::Left,
                        button_state: MouseButtonState::Up,
                        ..
                    } = event
                    {
                        let app = tray.app_handle();
                        if let Some(w) = app.get_webview_window("main") {
                            if w.is_visible().unwrap_or(false) {
                                let _ = w.hide();
                            } else {
                                let _ = w.show();
                                let _ = w.set_focus();
                            }
                        }
                    }
                })
                .build(app)?;

            // ---- battery-aware tray tooltip (1 Hz, negligible cost) -------
            let handle = app.handle().clone();
            let tip_engine = engine.clone();
            tauri::async_runtime::spawn(async move {
                let mut tick = tokio::time::interval(std::time::Duration::from_secs(1));
                loop {
                    tick.tick().await;
                    let snap = tip_engine.snapshot();
                    let running = tip_engine.is_running();
                    let devices = tip_engine.devices();
                    let name = devices
                        .first()
                        .map(|d| d.name.clone())
                        .unwrap_or_else(|| "no controller".into());
                    let battery = if snap.battery >= 0 {
                        format!(" · {}%{}", snap.battery, if snap.charging { " ⚡" } else { "" })
                    } else {
                        String::new()
                    };
                    let tip = if running {
                        format!("PadFlow — {name}{battery} · {} Hz", snap.poll_hz.max(1))
                    } else {
                        format!("PadFlow — idle ({name})")
                    };
                    if let Some(tray) = handle.tray_by_id("padflow-tray") {
                        let _ = tray.set_tooltip(Some(tip));
                    }
                }
            });

            // ---- auto-start the realtime engine & HidHide whitelist ------
            let boot = app.handle().clone();
            let boot_engine = engine.clone();
            tauri::async_runtime::spawn(async move {
                let _ = hidhide::auto_whitelist_current_process();
                let _ = commands::run_engine_with_telemetry(&boot_engine, &boot);
            });

            Ok(())
        })
        .on_window_event(|window, event| {
            // Closing the window parks PadFlow in the tray instead of exiting.
            if let WindowEvent::CloseRequested { api, .. } = event {
                let _ = window.hide();
                api.prevent_close();
            }
        })
        .run(tauri::generate_context!())
        .expect("error while running PadFlow application");
}
